<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#FDF2F8"/>
<title>Extinction Lab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--app-grad);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;color:var(--t);position:fixed;width:100%;height:100%}

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500;600;700&display=swap');

:root{
  /* App shell — helles, warmes Rosa (wie zuvor), nur dezentes Lila am unteren Rand */
  --app-grad:linear-gradient(168deg,#FFFBFC 0%,#FDF2F8 30%,#FCE7F3 58%,#FAE8FF 100%);
  --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'DM Mono',ui-monospace,monospace;
  /* Typo-Skala */
  --fs-screen:1.375rem;
  --fs-screen-sub:0.8125rem;
  --fs-card-hd:0.9375rem;
  --fs-card-title:1rem;
  --fs-body:0.875rem;
  --fs-small:0.75rem;
  --fs-meta:0.625rem;
  --canvas:#FFF5F8;
  --surface:#FFFFFF;
  --surface2:#F4F3F0;
  --border:#EBEBEB;
  /* Text (neutral wie Prototyp) */
  --t:#111111;
  --t2:#6B6B6B;
  --t3:#ABABAB;
  --ico-mut:rgba(220,38,38,0.12);
  --ico-action:rgba(217,119,6,0.12);
  --ico-fund:rgba(5,150,105,0.12);
  --ico-def:rgba(30,58,82,0.1);
  /* Trinity */
  --g:#059669; --gb:#ECFDF5; --gm:#6EE7B7; --gd:#065F46;
  --r:#DC2626; --rb:#FEF2F2;
  --am:#D97706; --amb:#FEF3C7;
  /* Areas */
  --dating:#EC4899; --business:#4A90E2; --social:#3B82F6; --karriere:#7C3AED;
  --gesundheit:#0F766E; --wachstum:#0891B2; --finanzen:#92400E;
  /* Deep */
  --deep:#1E3A52;
  /* Compat aliases */
  --s:var(--surface); --s2:var(--surface2); --bd:var(--border); --bd2:#E5E5EA;
  --bg:var(--app-grad);
  /* Bento / glass system */
  --bento-r:20px;
  --bento-r-sm:14px;
  --bento-blur:24px;
  --bento-fill:rgba(255,255,255,0.76);
  --bento-fill-strong:rgba(255,255,255,0.9);
  --bento-line:rgba(255,255,255,0.55);
  --bento-shade:0 8px 32px rgba(15,23,42,0.07);
  --bento-shade-sm:0 2px 12px rgba(15,23,42,0.04);
  --bento-inset:0 1px 0 rgba(255,255,255,0.85) inset;
  /* Safe areas */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

#app{height:100%;display:flex;flex-direction:column;background:transparent}
#wrap{flex:1;overflow:hidden;position:relative;background:transparent}
.scr{position:absolute;inset:0;background:transparent;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}

/* ── Shell: Bottom nav (bento) ── */
#nav{
  position:relative;z-index:400;
  flex-shrink:0;margin:0 14px calc(var(--safe-b) + 10px);padding:6px 4px 8px;
  display:flex;background:#F3F4F6;backdrop-filter:blur(var(--bento-blur));-webkit-backdrop-filter:blur(var(--bento-blur));
  border:1px solid #E5E7EB;border-radius:var(--bento-r);
  box-shadow:var(--bento-inset),var(--bento-shade-sm);
}
.ntab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-family:var(--font-mono);border-radius:14px;transition:background .15s}
.ntab{color:#A3A3A3}
.ntab.on{background:transparent;color:#7A7A7A}
.nlbl{font-size:7px;font-weight:500;color:#A3A3A3;letter-spacing:0.06em}
.ntab.on .nlbl{font-weight:700;color:#7A7A7A}
.nicon{width:38px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:inherit}
.nt-dot{width:5px;height:5px;border-radius:50%;margin-top:1px;background:transparent;flex-shrink:0}
.ntab.on .nt-dot{background:var(--g)}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--safe-b) + 92px);right:18px;width:52px;height:52px;border-radius:26px;background:var(--deep);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 8px 28px rgba(30,58,82,0.28);z-index:200;transition:transform .15s;animation:fabPulse 2.5s ease-in-out infinite}
.fab:active{transform:scale(.9)}
@keyframes fabPulse{0%,100%{box-shadow:0 4px 16px rgba(30,58,82,0.25)}50%{box-shadow:0 4px 24px rgba(30,58,82,0.4),0 0 0 5px rgba(30,58,82,0.08)}}

/* ── HOME ── */
#s-home{overflow-y:auto;padding-bottom:100px;background:var(--app-grad)}
#s-home::-webkit-scrollbar{display:none}

/* Home greeting — kein weißer Block, Typo auf Verlauf */
.home-greeting{
  flex-shrink:0;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 14px) 20px 10px;background:transparent;
}
.hm-avatar-wrap{width:54px;height:54px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#C4B5FD 0%,#F9A8D4 100%);
  box-shadow:0 2px 10px rgba(15,23,42,0.07);
}
.hm-photo-img{width:100%;height:100%;object-fit:cover;display:none;border-radius:50%}
.hm-photo-img.on{display:block}
.hm-photo-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-sans);font-size:20px;font-weight:800;color:rgba(17,24,39,0.45);
}
.hm-photo-fallback.hide{display:none}
.hm-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hm-line1{font-family:var(--font-sans);font-size:21px;font-weight:800;color:var(--t);letter-spacing:-0.03em;line-height:1.15}
.hm-line2{font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--t2);line-height:1.35}
.hm-side{width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,255,255,0.45);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--t2);transition:background .15s;
}
.hm-side:active{background:rgba(255,255,255,0.7)}
.hm-side svg{display:block}
/* Profil-Funnel */
#profile-funnel{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:var(--canvas);
  flex-direction:column;
  overflow:hidden;
}
#profile-funnel.on{display:flex}
.pf-topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  flex-shrink:0;
}
.pf-close{
  background:none;
  border:none;
  font-size:22px;
  color:var(--t3);
  cursor:pointer;
  padding:4px;
  line-height:1;
}
.pf-step-lbl{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:600;
  color:var(--t3);
  letter-spacing:0.08em;
}
.pf-progress{
  flex-shrink:0;
  height:3px;
  background:var(--border);
  margin:0 18px;
  border-radius:99px;
  overflow:hidden;
}
.pf-progress-fill{
  height:100%;
  background:var(--t);
  border-radius:99px;
  transition:width 0.3s ease;
}
.pf-scroll{
  flex:1;
  overflow-y:auto;
  padding:24px 20px 20px;
}
.pf-scroll::-webkit-scrollbar{display:none}
.pf-q-title{
  font-family:var(--font-sans);
  font-size:22px;
  font-weight:800;
  color:var(--t);
  line-height:1.3;
  letter-spacing:-0.03em;
  margin-bottom:8px;
}
.pf-q-sub{
  font-family:var(--font-sans);
  font-size:14px;
  color:var(--t2);
  line-height:1.5;
  margin-bottom:24px;
}
.pf-opt{
  width:100%;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  font-family:var(--font-sans);
  font-size:14px;
  font-weight:500;
  color:var(--t);
  text-align:left;
  transition:all 0.15s;
}
.pf-opt:active{transform:scale(0.98)}
.pf-opt.on{
  border-color:var(--t);
  background:var(--t);
  color:#fff;
}
.pf-opt-emoji{
  font-size:20px;
  flex-shrink:0;
  width:28px;
  text-align:center;
}
.pf-opt-check{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1.5px solid var(--border);
  flex-shrink:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.15s;
}
.pf-opt.on .pf-opt-check{
  background:rgba(255,255,255,0.25);
  border-color:rgba(255,255,255,0.4);
}
.pf-rating-row{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:16px 0 24px;
}
.pf-rating-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:1.5px solid var(--border);
  background:var(--surface);
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px;
  font-weight:800;
  color:var(--t2);
  cursor:pointer;
  transition:all 0.15s;
  display:flex;
  align-items:center;
  justify-content:center;
}
.pf-rating-btn.on{
  border-color:var(--t);
  background:var(--t);
  color:#fff;
}
.pf-foot{
  flex-shrink:0;
  padding:12px 18px calc(var(--safe-b) + 18px);
  display:flex;
  gap:10px;
}
.pf-btn-back{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 20px;
  font-family:var(--font-sans);
  font-size:14px;
  font-weight:600;
  color:var(--t2);
  cursor:pointer;
  flex-shrink:0;
}
.pf-btn-next{
  flex:1;
  background:var(--t);
  border:none;
  border-radius:14px;
  padding:14px 20px;
  font-family:var(--font-sans);
  font-size:14px;
  font-weight:700;
  color:#fff;
  cursor:pointer;
  opacity:0.35;
  transition:opacity 0.2s;
}
.pf-btn-next.rdy{opacity:1}
.pf-result-wrap{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:20px;
}
.pf-result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  box-shadow:0 2px 12px rgba(0,0,0,0.05);
}
.pf-result-card-label{
  font-family:var(--font-mono);
  font-size:9px;
  font-weight:700;
  color:var(--t3);
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.pf-result-card-title{
  font-family:var(--font-sans);
  font-size:17px;
  font-weight:800;
  color:var(--t);
  letter-spacing:-0.02em;
  margin-bottom:6px;
  line-height:1.3;
}
.pf-result-card-text{
  font-family:var(--font-sans);
  font-size:13px;
  color:var(--t2);
  line-height:1.6;
}
.pf-result-hero{
  background:var(--deep);
  border:none;
  border-radius:22px;
  padding:22px 20px;
  box-shadow:0 8px 28px rgba(30,58,82,0.2);
}
.pf-result-hero .pf-result-card-label{color:rgba(255,255,255,0.45)}
.pf-result-hero .pf-result-card-title{color:#fff;font-size:20px}
.pf-result-hero .pf-result-card-text{color:rgba(255,255,255,0.7);font-size:14px;line-height:1.65}
.pf-tag-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}
.pf-tag{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  padding:5px 11px;
  border-radius:99px;
  background:rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.8);
  letter-spacing:0.05em;
}
.pf-start-row{display:flex;gap:10px;margin-top:6px}

/* Bento-Raster: volle Zeilen + 2 Spalten für Quest-Liste */
.home-bento{
  display:grid;grid-template-columns:1fr;gap:10px;padding:8px 16px 20px;
}
@media (min-width:400px){
  .home-bento{grid-template-columns:1fr 1fr}
}
.home-bento > .kpi-card,
.home-bento > #hwf,
.home-bento > #hbl,
.home-bento > #hpb,
.home-bento > #hpq{grid-column:1 / -1}
.home-bento > #hqs{grid-column:1 / -1}
.hpq-slot:empty{display:none}
#hpq .pq-row{
  width:100%;text-align:left;display:flex;align-items:center;gap:12px;
  padding:14px 0;border:none;border-bottom:1px solid rgba(17,24,39,0.07);
  background:transparent;cursor:pointer;font-family:var(--font-sans);
}
#hpq .pq-row:last-of-type{border-bottom:none}
#hpq .pq-id{font-family:var(--font-mono);font-size:10px;font-weight:800;color:var(--t3);letter-spacing:0.04em;flex-shrink:0;min-width:40px}
#hpq .pq-mid{flex:1;min-width:0;text-align:left}
#hpq .pq-title{font-size:15px;font-weight:800;color:var(--t);letter-spacing:-0.02em;line-height:1.25}
#hpq .pq-cat{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.08em;margin-top:3px}
#hpq .pq-chev{color:var(--t3);font-size:14px;flex-shrink:0}
/* Profil-Quest-Zeilen: Intensität nach level (1 hell → 4 dunkel) */
#hpq .pq-row[data-pq-lvl="1"]{border-radius:0}
#hpq .pq-row[data-pq-lvl="2"]{
  margin:2px -6px;padding:14px 10px;border-radius:14px;
  background:rgba(17,24,39,0.04);border-bottom-color:transparent;
}
#hpq .pq-row[data-pq-lvl="3"]{
  margin:4px -8px;padding:15px 12px;border-radius:16px;
  background:linear-gradient(145deg,rgba(30,41,59,0.10) 0%,rgba(17,24,39,0.06) 100%);
  border:1px solid rgba(17,24,39,0.08);border-bottom:none;
}
#hpq .pq-row[data-pq-lvl="4"]{
  margin:6px -8px;padding:16px 14px;border-radius:18px;
  background:linear-gradient(155deg,#1e293b 0%,#0f172a 55%,#111827 100%);
  border:1px solid rgba(255,255,255,0.10);border-bottom:none;
  box-shadow:0 8px 24px rgba(15,23,42,0.25);
}
#hpq .pq-row[data-pq-lvl="4"] .pq-id{color:rgba(248,250,252,0.55)}
#hpq .pq-row[data-pq-lvl="4"] .pq-title{color:#f8fafc}
#hpq .pq-row[data-pq-lvl="4"] .pq-cat{color:rgba(226,232,240,0.65)}
#hpq .pq-row[data-pq-lvl="4"] .pq-chev{color:rgba(248,250,252,0.5)}

/* KPI-Karte (Streak + Punkte heute + Stimmung + Wochen-Ampel) */
.kpi-card,.streak-card{
  background:var(--bento-fill);backdrop-filter:blur(var(--bento-blur));-webkit-backdrop-filter:blur(var(--bento-blur));
  border:1px solid var(--bento-line);border-radius:22px;
  padding:16px 16px 14px;box-shadow:var(--bento-inset),0 6px 18px rgba(17,24,39,0.06);
}
.kpi-streak{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;
}
.kpi-streak-main{display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1}
.kpi-flame{font-size:40px;line-height:1;flex-shrink:0;margin-top:2px}
.kpi-streak-textcol{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.kpi-streak-n{font-family:var(--font-sans);font-size:58px;font-weight:800;color:var(--t);line-height:1;letter-spacing:-0.05em}
.kpi-streak-sub{font-family:var(--font-sans);font-size:13px;font-weight:600;color:var(--t2);line-height:1.25}
.kpi-streak-sub span{font-size:13px;margin-left:2px}
.kpi-today-pill{
  flex-shrink:0;align-self:flex-start;margin-top:4px;
  background:rgba(17,24,39,0.06);border:1px solid var(--bento-line);
  border-radius:999px;padding:8px 12px;font-family:var(--font-sans);font-size:11px;font-weight:800;
  color:var(--t);letter-spacing:0.04em;text-transform:uppercase;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
}
.kpi-today-pill.kpi-today-pill--hide{display:none!important}
.kpi-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:4px}
.kpi-dcell{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
/* Ampel-Ring um Wochentag + Datum */
.kpi-dayring{
  width:46px;height:46px;min-width:46px;min-height:46px;border-radius:50%;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  box-sizing:border-box;border:3px solid #D1D5DB;background:rgba(255,255,255,0.55);
  padding:1px 2px;line-height:1;
}
.kpi-dayring.today-sel{
  box-shadow:0 0 0 2px rgba(17,24,39,0.12), 0 4px 10px rgba(17,24,39,0.10);
  transform:translateY(-1px);
}
.kpi-dayring .kpi-dlbl{font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:600;color:var(--t3);letter-spacing:0.02em;margin:0;line-height:1.1}
.kpi-dayring .kpi-dlbl.today{color:var(--t);font-weight:800}
.kpi-dayring .kpi-dd{font-family:var(--font-mono);font-size:0.6875rem;font-weight:700;color:var(--t2);margin:0;line-height:1.15}
.kpi-dayring.future{border-style:dashed;opacity:0.45}
.kpi-dayring.r{border-color:#EF4444;background:rgba(254,226,226,0.35)}
.kpi-dayring.y{border-color:#CA8A04;background:rgba(254,249,195,0.45)}
.kpi-dayring.g{border-color:#16A34A;background:rgba(220,252,231,0.45)}
.kpi-dayring.neutral{border-style:dashed;opacity:0.55;background:rgba(249,250,251,0.85);border-color:rgba(17,24,39,0.12)}

/* Profil-Quests: Vollbild-Detail (Bento-Blur, außerhalb #wrap) */
#quest-detail.pf-qd.scr{
  position:fixed;inset:0;z-index:260;
  flex-direction:column;overflow:hidden;box-sizing:border-box;
  padding:calc(var(--safe-t) + 10px) 18px calc(var(--safe-b) + 96px);
  background:rgba(255,251,252,0.92);
  backdrop-filter:blur(var(--bento-blur));-webkit-backdrop-filter:blur(var(--bento-blur));
}
#quest-detail.pf-qd.scr.on{display:flex}
#quest-detail.pf-qd .pf-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:14px;flex-shrink:0;padding:0;
}
#quest-detail.pf-qd .pf-close{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--bento-line);
  background:var(--bento-fill);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:18px;line-height:1;color:var(--t2);cursor:pointer;
  box-shadow:var(--bento-inset),var(--bento-shade-sm);
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:transform .12s,background .15s;
}
#quest-detail.pf-qd .pf-close:active{transform:scale(0.96);background:rgba(255,255,255,0.9)}
#quest-detail.pf-qd .pf-step-lbl{
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.12em;
  color:var(--t3);text-align:right;flex:1;
}
#quest-detail.pf-qd .pf-scroll{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 0 8px;
}
#quest-detail.pf-qd .pf-q-meta{
  font-family:var(--font-sans);font-size:13px;font-weight:700;color:var(--t2);
  margin-bottom:6px;letter-spacing:-0.01em;
}
/* Quiet Echo: Trigger dominant lesbar */

}

}
.ov-card-time{font-family:var(--font-sans);font-size:var(--fs-small);font-weight:600;color:#6B7280;display:flex;align-items:center;gap:5px}
.ov-card-go{
  flex-shrink:0;background:#fff;border:1px solid rgba(17,24,39,0.1);border-radius:14px;
  padding:10px 14px;font-family:var(--font-sans);font-size:var(--fs-screen-sub);font-weight:700;color:#111827;cursor:pointer;
  transition:opacity .15s,transform .12s;
}
.ov-card-go--muted{background:rgba(255,255,255,0.62);color:#4B5563;border-color:rgba(17,24,39,0.1)}
.ov-card-go:disabled{opacity:0.5;cursor:default}
.ov-card-go:active:not(:disabled){transform:scale(.97)}
.ov-card-go:disabled{opacity:0.42;cursor:not-allowed}
.ov-empty{
  text-align:center;padding:36px 16px;font-family:var(--font-sans);font-size:var(--fs-body);color:#6B7280;line-height:1.55;
}
.acc-group{
  background:var(--bento-fill);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--bento-r);border:1px solid var(--bento-line);margin-bottom:10px;overflow:hidden;
  box-shadow:var(--bento-inset),var(--bento-shade-sm);
}
.acc-hd{width:100%;background:none;border:none;padding:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:inherit;text-align:left}
.acc-hd-l{display:flex;align-items:center;gap:10px}
.acc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.acc-cat{font-family:var(--font-sans);font-size:var(--fs-card-title);font-weight:700;color:var(--t);letter-spacing:-0.01em}
.acc-count{font-family:var(--font-mono);font-size:0.6875rem;color:var(--t3);background:var(--surface2);border-radius:99px;padding:2px 9px}
.acc-arr{font-size:14px;color:var(--t3);transition:transform .2s}
.acc-arr.open{transform:rotate(180deg)}
.acc-body{display:none;border-top:1px solid var(--border)}
.acc-body.open{display:block}
.acc-o{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px 15px;cursor:pointer;font-family:inherit;text-align:left;margin-bottom:8px;transition:all .15s}
.acc-o:active{transform:scale(.98)}
.ql-item{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.ql-item:last-child{border-bottom:none}
.ql-color{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;min-height:40px}
.ql-info{flex:1}
.ql-title{font-family:var(--font-sans);font-size:var(--fs-body);font-weight:700;color:var(--t);margin-bottom:4px;letter-spacing:-0.01em;line-height:1.3}
.ql-hook{font-family:var(--font-sans);font-size:var(--fs-small);color:var(--t2);line-height:1.5;margin-bottom:7px}
.ql-tags{display:flex;gap:5px;flex-wrap:wrap}

/* Programme — gleiche Kartenlogik wie Quest-Übersicht (ov-card), ohne weiße Sohle */
#s-prog{
  overflow-y:auto;
  background:var(--app-grad);
  padding-bottom:100px;
}
#s-prog::-webkit-scrollbar{display:none}
.prog-screen{min-height:100%}
.prog-hd{padding:calc(var(--safe-t) + 16px) 20px 8px}
.prog-hd-title{font-family:var(--font-sans);font-size:var(--fs-screen);font-weight:800;color:#111827;letter-spacing:-0.03em;line-height:1.15;margin:0 0 6px}
.prog-hd-sub{font-family:var(--font-sans);font-size:var(--fs-screen-sub);font-weight:500;color:#6B7280;line-height:1.45;margin:0}
.plist{padding:10px 18px 24px}
.prog-card.ov-card{
  transition:box-shadow .2s,transform .15s;
}
.prog-card--active{box-shadow:0 0 0 2px var(--g),0 10px 32px rgba(5,150,105,0.18)}
.prog-card-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.prog-tag{
  font-family:var(--font-sans);font-size:var(--fs-meta);font-weight:800;letter-spacing:0.08em;
  border-radius:99px;padding:6px 12px;line-height:1;
}
.prog-tag-cat{background:rgba(255,255,255,0.88);color:#374151;box-shadow:0 1px 4px rgba(15,23,42,0.06)}
.prog-tag-days{background:rgba(255,255,255,0.55);color:#4B5563;border:1px solid rgba(17,24,39,0.06)}
.prog-tag-done{background:#DCFCE7;color:#059669;border:1px solid rgba(5,150,105,0.2)}
.prog-progress{margin-top:14px}
.prog-progress-top{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:600;color:#4B5563;margin-bottom:6px}
.prog-progress-tr{height:6px;border-radius:99px;background:rgba(255,255,255,0.72);overflow:hidden}
.prog-progress-fill{height:100%;border-radius:99px;background:var(--p-accent,#111827);transition:width .4s ease}

/* ── STATS ── */
#s-st{overflow-y:auto;padding:calc(var(--safe-t) + 14px) 14px 28px;background:var(--app-grad)}
#s-st::-webkit-scrollbar{display:none}
.sf{display:flex;gap:6px;margin-bottom:18px}
.sf-b{
  flex:1;background:var(--bento-fill);border:1px solid var(--bento-line);border-radius:var(--bento-r-sm);padding:8px 4px;font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:600;color:var(--t3);cursor:pointer;text-align:center;transition:all .15s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--bento-shade-sm);
}
.sf-b.on{background:var(--t);border-color:transparent;color:#fff;box-shadow:none}
.sblock{
  background:var(--bento-fill);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--bento-r);border:1px solid var(--bento-line);padding:16px 18px;margin-bottom:12px;
  box-shadow:var(--bento-inset),var(--bento-shade-sm);
}
.sbt{font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:700;color:var(--t3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scell{text-align:center}
.sv{font-family:var(--font-sans);font-size:1.625rem;font-weight:800;letter-spacing:-0.03em;line-height:1;color:var(--t)}
.sl{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3);margin-top:4px;letter-spacing:0.06em}
.spct{font-family:var(--font-sans);font-size:3rem;font-weight:800;color:var(--g);letter-spacing:-0.04em;line-height:1}
.ssub{font-family:var(--font-sans);font-size:var(--fs-body);color:var(--t2);margin-top:6px;line-height:1.6}
.brow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.brow:last-child{margin-bottom:0}
.blabel{font-family:var(--font-sans);font-size:var(--fs-small);color:var(--t);min-width:88px;font-weight:500}
.btrack{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bfill{height:100%;border-radius:99px;transition:width .6s ease;opacity:0.7}
.bval{font-family:var(--font-mono);font-size:0.6875rem;color:var(--t2);min-width:28px;text-align:right}
.insight{background:var(--gb);border-radius:12px;padding:11px 13px;margin-top:12px}
.insight p{font-family:var(--font-sans);font-size:var(--fs-small);color:var(--gd);line-height:1.6}
.dq-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.dq-item:last-child{border-bottom:none}
.dq-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;margin-top:3px}
.dq-info{flex:1;min-width:0}
.dq-title{font-family:var(--font-sans);font-size:var(--fs-screen-sub);font-weight:600;color:var(--t);line-height:1.4;margin-bottom:3px}
.dq-meta{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3)}
.dq-reset{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t2);cursor:pointer;flex-shrink:0}
.avoid-r{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.avoid-r:last-child{border-bottom:none}
.avoid-cat{font-family:var(--font-sans);font-size:var(--fs-screen-sub);font-weight:600;color:var(--t)}
.avoid-n{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3);margin-top:1px}
.avoid-c{font-family:var(--font-sans);font-size:var(--fs-card-title);font-weight:800;color:var(--r);letter-spacing:-0.02em}
.aitem{padding:9px 0;border-bottom:1px solid var(--border)}
.aitem:last-child{border-bottom:none}
.aitem-t{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.adot{width:7px;height:7px;border-radius:50%}
.amet{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3)}
.atxt{font-family:var(--font-sans);font-size:var(--fs-screen-sub);color:var(--t);line-height:1.5}
.estat{text-align:center;padding:22px 0;font-family:var(--font-mono);color:var(--t3);font-size:var(--fs-small)}

/* ── SHEETS ── */
.olay{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;justify-content:flex-end}
.obg{position:absolute;inset:0;background:rgba(0,0,0,0.2);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fi .2s ease}
.sht{position:relative;background:var(--surface);border-radius:28px 28px 0 0;padding:0 20px calc(var(--safe-b) + 20px);max-height:92vh;display:flex;flex-direction:column;animation:su .3s cubic-bezier(.32,.72,0,1)}
.shdl{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px}
.sht-t{font-family:var(--font-sans);font-size:1.125rem;font-weight:800;color:var(--t);margin-bottom:5px;letter-spacing:-0.02em}
.sht-s{font-family:var(--font-sans);font-size:var(--fs-body);color:var(--t2);margin-bottom:18px;line-height:1.5}
.sht-sc{flex:1;overflow-y:auto;padding-bottom:8px}
.sht-sc::-webkit-scrollbar{display:none}

/* Wochenfokus & ähnliche gestapelte Sheets (grauer Grund wie Quest-Detail) */
.sht.sht--wf{
  background:#F3F4F6;
  padding-left:0;
  padding-right:0;
}
.sht--wf > .shdl{margin-bottom:14px}
.sht--wf .sht-wf-head{padding:0 20px 2px}
.sht--wf .sht-sc{padding:4px 18px 10px}
.sht--wf .sht-wf-row{
  display:flex;gap:10px;align-items:stretch;
  padding:10px 18px 0;margin-top:2px;
}
.sht--wf .sht-wf-row .btn-p{flex:1;margin:0;min-width:0}
.sht--wf .sht-wf-row .btn-p--wf-primary{flex:2;box-shadow:0 4px 14px rgba(5,150,105,0.22)}
.sht--wf .ov-card{margin-bottom:12px}
.sht--wf .ov-card:last-child{margin-bottom:4px}

/* Quest-Detail Bottom Card (Karten-Layout, seitlich eingerückt) */
.sht--qc{padding:0;display:flex;flex-direction:column;max-height:92vh;min-height:0;overflow:hidden;background:linear-gradient(180deg,#FFF7FA 0%,#FDF2F8 55%,#F5E6FF 100%)}
.qc-sheet{
  position:relative;
  display:flex;flex-direction:column;flex:1 1 0;min-height:0;overflow:hidden;
  padding:0 18px;
  box-sizing:border-box;
}
.qc-close-sheet{
  position:absolute;top:8px;right:10px;z-index:12;
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(17,24,39,0.08);
  background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 10px rgba(15,23,42,0.06);
  font-size:18px;line-height:1;color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:transform .12s,background .15s;
}
.qc-close-sheet:active{transform:scale(0.96);background:#fff}
.qc-sheet>.shdl{flex-shrink:0;margin-top:12px;margin-bottom:8px}
.qc-head{
  flex-shrink:0;position:sticky;top:8px;z-index:6;
  background:linear-gradient(145deg,#FEF7FB 0%,#FCEEF6 46%,#F8EAF3 100%);
  padding:16px 18px 18px;
  border-radius:22px;
  border:1px solid rgba(244,210,228,0.9);
  box-shadow:0 2px 12px rgba(15,23,42,0.05),0 8px 22px rgba(236,72,153,0.12);
  margin-bottom:10px;
}
.qc-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.qc-head-ico{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;box-shadow:0 4px 16px rgba(15,23,42,0.08);flex-shrink:0}
.qc-head-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.qc-dots-wrap{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,0.72);padding:7px 12px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.qc-dot{width:7px;height:7px;border-radius:50%;background:#E5E7EB}
.qc-dot--on{background:#4B5563}
.qc-pill{font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:800;letter-spacing:0.12em;padding:6px 11px;border-radius:99px;color:#fff;line-height:1}
.qc-pill--mut{background:#DC2626}
.qc-pill--action{background:#D97706}
.qc-pill--fund{background:#059669}
.qc-pill--fun{background:#EC4899}
.qc-pill--method{background:#7C3AED}
.qc-variant-list{margin:0;padding-left:18px;font-family:var(--font-sans);font-size:var(--fs-body);font-weight:500;color:#111827;line-height:1.55}
.qc-variant-list li{margin-bottom:6px}
.qc-method-row{
  width:100%;
  border:none;
  background:rgba(255,255,255,0.62);
  border-radius:16px;
  padding:12px 14px;
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  text-align:left;
  font-family:var(--font-sans);
  cursor:pointer;
}
.qc-method-row strong{
  display:block;
  font-size:var(--fs-body);
  font-weight:800;
  color:#111827;
  margin-bottom:3px;
}
.qc-method-row p{
  font-size:var(--fs-small);
  font-weight:500;
  color:#6B7280;
  line-height:1.4;
  margin:0;
}
.qc-method-row span{
  color:#9CA3AF;
  font-size:20px;
}
.qc-head-title{font-family:var(--font-sans);font-size:var(--fs-screen);font-weight:800;color:#111;line-height:1.2;letter-spacing:-0.03em;margin:12px 0 6px}
.qc-head-sub{font-family:var(--font-sans);font-size:var(--fs-body);font-weight:500;color:#6B7280;line-height:1.45}
.qc-scroll{flex:1 1 0;overflow-y:auto;min-height:0;padding:6px 0 14px;background:transparent;-webkit-overflow-scrolling:touch}
.qc-scroll::-webkit-scrollbar{display:none}
.qc-block{margin-bottom:14px}
/* Quest-Detail: gestapelte Cards (Mockup) */
.qc-card{
  border-radius:22px;padding:16px 18px;margin-bottom:12px;
  box-shadow:0 2px 14px rgba(15,23,42,0.06);
  border:1px solid rgba(17,24,39,0.05);
}
.qc-card:last-of-type{margin-bottom:8px}
.qc-card--why{background:#FFF5F7}
.qc-card--nogo{background:#FFF1F3}
.qc-card--trigger{background:#EBF0FF;border-color:rgba(164,180,230,0.28)}
.qc-card--action{background:#FFFCFB;border-color:rgba(245,218,230,0.5)}
.qc-card--mod{background:#EAF0FF;border-color:rgba(164,180,230,0.30)}
.qc-card-hd{
  font-family:var(--font-sans);font-size:var(--fs-meta);font-weight:800;letter-spacing:0.12em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.qc-card-hd--brain{color:#7C3AED}
.qc-card-hd--nogo{color:#DC2626}
.qc-card-hd--trigger{color:#5B21B6}
.qc-card-hd--action{color:#7C3AED}
.qc-card-hd--mod{color:#5B21B6}
.qc-card-body{font-family:var(--font-sans);font-size:var(--fs-body);font-weight:500;color:#111827;line-height:1.55}
.qc-card-body-sub{margin-top:10px;font-size:var(--fs-screen-sub);font-weight:500;color:#6B7280;line-height:1.55}
.qc-mod-row{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid rgba(17,24,39,0.06)}
.qc-mod-row:first-of-type{border-top:none;padding-top:0}
.qc-mod-ico{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;line-height:1;color:#fff;
}
.qc-mod-ico--plus{background:linear-gradient(145deg,#4ADE80,#22C55E);box-shadow:0 2px 8px rgba(34,197,94,0.35)}
.qc-mod-ico--minus{background:#D1D5DB;color:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,0.06)}
.qc-mod-txt{flex:1;min-width:0;margin:0;font-family:var(--font-sans);font-size:var(--fs-body);font-weight:500;color:#111827;line-height:1.5;padding-top:2px}
.qc-lbl{font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:700;letter-spacing:0.11em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.qc-lbl--brain{color:var(--t3)}
.qc-lbl--nogo{color:#DC2626}
.qc-lbl--trigger{color:#059669}
.qc-lbl--mod{color:var(--t3)}
.qc-bubble{border-radius:18px;padding:14px 16px;font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.55}
.qc-bubble--grey{background:#F3F4F6;color:var(--t);border:1px solid rgba(17,24,39,0.06)}
.qc-bubble--mint{background:#ECFDF5;color:#065F46;border:1px solid rgba(5,150,105,0.14)}
.qc-bubble--rose{background:#FEF2F2;color:#991B1B;border:1px solid rgba(220,38,38,0.12)}
.qc-bubble--modplus{background:#ECFDF5;color:#065F46;border:1px solid rgba(5,150,105,0.16);margin-bottom:10px}
.qc-bubble--modminus{background:#F3F4F6;color:var(--t);border:1px solid var(--border)}
.qc-mod-hint{font-weight:800;margin-right:6px;font-size:var(--fs-card-hd);vertical-align:middle}
.qc-xp-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;background:linear-gradient(90deg,#C4B5FD 0%,#F0ABFC 50%,#FBCFE8 100%);color:#fff;font-family:var(--font-sans);font-size:var(--fs-screen-sub);font-weight:800;margin-top:2px;box-shadow:0 6px 18px rgba(167,139,250,0.28)}
.qc-lock-banner{
  font-family:var(--font-sans);
  font-size:13px;
  font-weight:600;
  color:var(--t2);
  line-height:1.45;
  background:rgba(234,179,8,0.1);
  border:1px solid rgba(234,179,8,0.28);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:14px;
}
.qc-foot{
  flex-shrink:0;
  padding:14px 0 calc(var(--safe-b) + 14px);
  background:transparent;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.qc-btn{
  border:none;
  border-radius:20px;
  min-height:60px;
  padding:16px 22px;
  font-family:var(--font-sans);
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:transform .12s, box-shadow .12s, filter .12s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.qc-btn:active{transform:scale(.98)}
.qc-btn--primary{
  background:linear-gradient(90deg,#A78BFA 0%,#D97AF3 48%,#F472B6 100%);
  color:#fff;
  box-shadow:0 8px 20px rgba(217,122,243,0.28);
}
.qc-btn--primary:hover{filter:saturate(1.03)}
.qc-btn--ghost{
  background:#ECEDEF;
  color:#6B7280;
  border:1px solid rgba(17,24,39,0.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
}
.qc-done-note{text-align:center;font-family:var(--font-sans);font-size:var(--fs-body);color:var(--t3);padding:8px 0 4px}

/* Sheet buttons */
.shbtn{
  width:100%;background:rgba(255,255,255,0.55);border:1px solid var(--bento-line);border-radius:var(--bento-r-sm);padding:13px 16px;font-family:var(--font-sans);font-size:var(--fs-body);font-weight:600;color:var(--t);cursor:pointer;text-align:left;margin-bottom:8px;transition:all .15s;display:flex;align-items:center;gap:12px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.shbtn:active{background:rgba(255,255,255,0.75);transform:scale(.98)}
.shbtn.on{background:var(--t);color:#fff;border-color:transparent}
.btn-sv{width:100%;background:var(--t);border:none;border-radius:14px;padding:15px;font-family:var(--font-sans);font-size:var(--fs-body);font-weight:700;color:#fff;cursor:pointer;margin-top:8px;opacity:.45;transition:all .2s}
.btn-sv.rdy{opacity:1}

/* Ref chips */
.ref-r{margin-bottom:18px}
.ref-rt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ref-rl{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3);letter-spacing:0.08em}
.ref-rv{font-family:var(--font-sans);font-size:var(--fs-screen);font-weight:800;letter-spacing:-0.03em;color:var(--t)}
.ref-rll{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3);margin-top:4px}
.ref-cl{font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:700;color:var(--t3);letter-spacing:0.08em;margin-bottom:10px}
.ref-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.rchip{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:7px 13px;font-family:var(--font-sans);font-size:var(--fs-small);font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s}
.rchip.on{background:var(--t);border-color:var(--t);color:#fff}
.ref-pl{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t3);letter-spacing:0.06em;margin-bottom:7px}
.ref-proof{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-family:var(--font-sans);font-size:var(--fs-screen-sub);color:var(--t);resize:none;min-height:72px;line-height:1.5;outline:none;margin-bottom:12px}
.ref-ins{background:var(--gb);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:none}
.ref-ins p{font-family:var(--font-sans);font-size:var(--fs-small);color:var(--gd);line-height:1.6}

/* Filter opts */
.fopt{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:7px 14px;font-family:var(--font-mono);font-size:var(--fs-meta);cursor:pointer;color:var(--t2);margin:4px;transition:all .15s;display:inline-block}
.fopt.on{background:var(--t);border-color:var(--t);color:#fff}

/* Emoji grid */
.emo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px}
.emo-chip{background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:inherit;transition:all .15s}
.emo-chip.on{background:var(--gb);border-color:var(--g)}
.emo-chip .emo{font-size:24px}
.emo-chip .elbl{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--t2);text-align:center;line-height:1.3}
.emo-chip.on .elbl{color:var(--g)}

/* Wochenfokus Home (weiße Karte + Gradient-Bubble) */
.wf-card-empty{
  width:100%;text-align:left;border:none;cursor:pointer;font:inherit;
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:#fff;border-radius:22px;
  box-shadow:0 4px 20px rgba(15,23,42,0.06),inset 0 1px 0 rgba(255,255,255,0.85);
  border:1px solid rgba(17,24,39,0.06);
  -webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .12s;
}
.wf-card-empty:active{transform:scale(.985);box-shadow:0 2px 12px rgba(15,23,42,0.08)}
.wf-ce-ico{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;
  background:linear-gradient(145deg,#E9D5FF 0%,#FBCFE8 48%,#FDE68A 100%);
  box-shadow:0 4px 14px rgba(192,132,252,0.22);
}
.wf-ce-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wf-ce-lbl{font-family:var(--font-sans);font-size:var(--fs-meta);font-weight:600;color:#9CA3AF;letter-spacing:0.06em;text-transform:uppercase}
.wf-ce-title{font-family:var(--font-sans);font-size:var(--fs-card-title);font-weight:800;color:#111827;letter-spacing:-0.02em;line-height:1.2}
.wf-ce-chev{font-size:22px;font-weight:300;color:#D1D5DB;line-height:1;flex-shrink:0;padding-left:2px}

.wf-card-filled{
  width:100%;text-align:left;border:none;cursor:pointer;font:inherit;
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:#fff;border-radius:22px;
  box-shadow:0 4px 20px rgba(15,23,42,0.06);
  border:1px solid rgba(17,24,39,0.06);
  -webkit-tap-highlight-color:transparent;transition:transform .12s;
}
.wf-card-filled:active{transform:scale(.985)}
.wf-cf-ico{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:linear-gradient(145deg,#E9D5FF 0%,#FBCFE8 100%);
  box-shadow:0 2px 10px rgba(236,72,153,0.12);
}
.wf-cf-mid{flex:1;min-width:0}
.wf-cf-lbl{font-family:var(--font-sans);font-size:var(--fs-meta);font-weight:600;color:#9CA3AF;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
.wf-cf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.wf-cf-em{font-size:20px;line-height:1}
.wf-cf-more{font-family:var(--font-mono);font-size:var(--fs-meta);font-weight:600;color:#9CA3AF}
.wf-cf-goal{font-family:var(--font-sans);font-size:var(--fs-body);font-weight:600;color:#374151;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.wf-cf-chev{color:#D1D5DB;font-size:20px;flex-shrink:0}

/* Wochenfokus Bottom Sheet Zeilen */
.wf-wz-row{margin-bottom:10px;border-radius:18px;overflow:hidden;border:1.5px solid #E5E7EB;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,0.04);transition:border-color .15s,box-shadow .15s}
.wf-wz-row--on{border-color:#C4B5FD;box-shadow:0 4px 16px rgba(192,132,252,0.14)}
.wf-wz-btn{width:100%;background:none;border:none;padding:14px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;font:inherit;text-align:left}
.wf-wz-emo{font-size:24px;line-height:1;flex-shrink:0}
.wf-wz-mid{flex:1;min-width:0}
.wf-wz-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wf-wz-lbl{font-family:var(--font-sans);font-size:var(--fs-card-hd);font-weight:800;color:#111827;letter-spacing:-0.02em}
.wf-wz-stars{font-size:var(--fs-small);letter-spacing:0;font-family:var(--font-sans)}
.wf-wz-check{width:26px;height:26px;border-radius:50%;border:2px solid #D1D5DB;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.wf-wz-check.on{border-color:transparent;background:linear-gradient(135deg,#A855F7,#EC4899)}
.wf-wz-inwrap{padding:0 14px 14px;display:none}
.wf-wz-inwrap--show{display:block}
.wf-wz-field{width:100%;background:#F9FAFB;border:1.5px solid #E5E7EB;border-radius:14px;padding:12px 14px;font-size:14px;color:#111827;font-family:inherit;outline:none;box-sizing:border-box}
.wf-wz-field:focus{border-color:#C084FC;background:#fff}
.wf-wz-segs{display:flex;gap:6px;margin-top:12px}
.wf-wz-seg{flex:1;height:5px;border-radius:99px;background:#E5E7EB;transition:background .2s}
.wf-wz-seg.on{background:linear-gradient(90deg,#C084FC,#EC4899)}
.wf-wz-sub{color:#6B7280;font-weight:500}
.qc-btn--primary:disabled,.qc-btn--primary.wf-save--off{
  background:#E5E7EB!important;color:#9CA3AF!important;box-shadow:none!important;cursor:not-allowed;transform:none!important;
}

/* Celebration */
@keyframes celIn{from{opacity:0}to{opacity:1}}
@keyframes celCheck{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes celCircle{from{stroke-dashoffset:226}to{stroke-dashoffset:0}}
@keyframes celPop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes celUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes confFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(700px) rotate(540deg);opacity:0}}

/* Sheet animations */
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sir{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

/* Misc */
input[type=range]{width:100%;accent-color:var(--t);cursor:pointer;height:4px}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">

    <!-- HOME -->
    <div class="scr on" id="s-home">
      <div class="home-greeting">
        <div class="hm-avatar-wrap">
          <div class="hm-photo-fallback" id="home-avatar-fallback">B</div>
        </div>
        <div class="hm-copy">
          <div class="hm-line1" id="home-greeting">Hallo Belal</div>
          <div class="hm-line2" id="home-level-copy">Lv. 0 Starter</div>
        </div>
        <button type="button" class="hm-side" aria-label="Profil">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21a8 8 0 10-16 0"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
      <div class="home-scroll home-bento">
        <div class="kpi-card">
          <div class="kpi-streak">
            <div class="kpi-streak-main">
              <div class="kpi-flame" aria-hidden="true">🔥</div>
              <div class="kpi-streak-textcol">
                <span class="kpi-streak-n" id="kpi-done-val">0</span>
                <span class="kpi-streak-sub">Tage Streak</span>
              </div>
            </div>
            <div class="kpi-today-pill kpi-today-pill--hide" id="kpi-today-pill" aria-live="polite"></div>
          </div>
          <div class="kpi-week" id="kpi-week"></div>
        </div>
        <div id="hpq" class="hpq-slot" aria-live="polite"></div>
        <div id="hqs"></div>
      </div>
    </div>

    <!-- QUESTS -->
    <div class="scr" id="s-q">
      <header class="q-ov-hd">
        <h1 class="q-ov-title">Übersicht</h1>
        <p class="q-ov-sub">Filtern und Quest direkt starten.</p>
      </header>
      <div class="ov-wrap" id="ov-wrap"></div>
    </div>

    <!-- STATS -->
    <div class="scr" id="s-stats">
      <div style="flex:1;overflow-y:auto;padding:calc(var(--safe-t)+10px) 20px 100px"
        id="stats-wrap"></div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div id="nav">
    <button class="ntab on" id="nt-home" onclick="go('home')">
      <div class="nicon" id="ni-home">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9.5z"/>
          <path d="M9 21v-6h6v6"/>
        </svg>
      </div>
      <span class="nlbl">HOME</span>
      <span class="nt-dot"></span>
    </button>
    <button class="ntab" id="nt-q" onclick="go('q')">
      <div class="nicon" id="ni-q">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="4" y="4" width="6" height="6" rx="1.5"/>
          <rect x="14" y="4" width="6" height="6" rx="1.5"/>
          <rect x="4" y="14" width="6" height="6" rx="1.5"/>
          <rect x="14" y="14" width="6" height="6" rx="1.5"/>
        </svg>
      </div>
      <span class="nlbl">QUESTS</span>
      <span class="nt-dot"></span>
    </button>
    <button class="ntab" id="nt-stats" onclick="go('stats')">
      <div class="nicon" id="ni-stats">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="12" y1="20" x2="12" y2="8"/>
          <line x1="18" y1="20" x2="18" y2="4"/>

      <span class="nlbl">PROFIL</span>
      <span class="nt-dot"></span>

  <div id="quest-detail" class="scr pf-qd">

      <div class="pf-result-hero" style="margin-top:14px;">

    <div class="pf-foot">
      <button type="button" class="pf-btn-next rdy" onclick="startQuest()">QUEST STARTEN</button>
    </div>
  </div>
</div>

<script type="application/json" id="xl-quests-embed">[{"category":"Dating","skill":"Presence","level":1,"title":"Der 3s-Blick","trigger":"Halte den Blickkontakt bei einer attraktiven Person bewusst 3 Sek. lang, lächle leicht und schau erst dann ruhig weiter.","friction":"Ehrlichkeit. Das gegenseitige 'Erkennen' aushalten, ohne die Augen sofort schüchtern wegzuziehen.","rule":"Nicht nach unten wegsehen. Halte den Kopf oben.","id":"D1.1"},{"id":"D1.2","category":"Dating","level":1,"title":"Räumliche Exposition","trigger":"Setz dich (Café/Isar) bewusst in die Nähe einer attraktiven Person, auch wenn woanders viel Platz wäre.","friction":"Nähe & Präsenz. Die eigene körperliche Anspannung im energetischen Feld der Person aushalten.","rule":"Kein Handy. Bleib 5 Min. einfach nur präsent sitzen. Du musst nicht reden, nur den Raum halten.","skill":"Intention"},{"id":"D1.3","category":"Dating","level":1,"title":"The Slow Turn","trigger":"Wenn du an jemandem vorbeiläufst, den du attraktiv findest, dreh den Kopf beim Passieren bewusst langsam mit.","friction":"Fokus-Kontrolle. Das Signal senden: 'Ich habe dich gesehen und ich stehe zu meiner Aufmerksamkeit.'","rule":"Kein hektisches Nicken. Die Bewegung ist flüssig und kontrolliert wie bei einem Leader.","skill":"Intention"},{"category":"Dating","skill":"Intention","level":2,"title":"Vibe-Drop","trigger":"Sag im Vorbeigehen: 'Du hast eine wahnsinnig tolle Ausstrahlung.' Geh sofort weiter.","friction":"Absicht zeigen. Ein Kompliment geben, ohne die Sicherheit einer Antwort zu haben (Take-away-Frame).","rule":"Kein Stopp. Wer weitergeht, signalisiert: 'Ich brauche nichts von dir.'","id":"D2.1"},{"id":"D2.2","category":"Dating","level":2,"title":"Style-Note","trigger":"Sag im Stehenbleiben: 'Dein Style ist echt mutig, sieht man hier selten.' – Nicken und Weggehen.","friction":"Urteilskraft. Deine subjektive Meinung laut äußern, ohne nach Bestätigung zu suchen.","rule":"Die Handlung endet mit deinem Satz. Die Reaktion des anderen ist für den Quest-Erfolg irrelevant.","skill":"Intention"},{"id":"D2.3","category":"Dating","level":2,"title":"Der Neugier-Opener","trigger":"Frag im Vorbeigehen: 'Bist du so cool wie du aussiehst oder täuscht das?' – Geh direkt weiter.","friction":"Spielerische Provokation. Den Frame setzen, dass du derjenige bist, der das Gegenüber prüft.","rule":"Lächle dabei. Es ist ein Kompliment, das als Herausforderung verpackt ist.","skill":"Intention"},{"id":"D3.1","category":"Dating","level":3,"title":"Der Alleingang","trigger":"Geh gezielt alleine in eine Bar und bleib dort für 15 Min. am Tresen stehen, ohne dein Handy zu nutzen.","friction":"Radikale Autonomie. Ohne soziale 'Sicherheitsdecke' (Freunde/Digitales) im öffentlichen Raum sichtbar sein.","rule":"Beobachte den Raum. Sei die Base. Wer sich ohne Ablenkung wohlfühlt, strahlt Dominanz aus.","skill":"Intention"},{"id":"D3.2","category":"Dating","level":3,"title":"Public Compliment","trigger":"Mach jemandem ein Vibe-Kompliment (D2.1), während Freunde der Person direkt daneben stehen.","friction":"Social Pressure. Die Aufmerksamkeit einer ganzen Gruppe aushalten, während du deine Intention zeigst.","rule":"Dein Fokus liegt nur auf der Zielperson. Blende die Umgebung für diesen Moment aus.","skill":"Intention"},{"category":"Dating","skill":"Wirkung","level":3,"title":"Die ehrliche Pause","trigger":"Wenn du jemanden kurz ansprichst, halte nach deinem ersten Satz bewusst 3 Sek. Schweigen und Blickkontakt.","friction":"Spannungs-Management. Die Stille zwischen zwei Fremden aktiv aushalten, statt sie nervös zu füllen.","rule":"Wer die Stille hält, führt das Gespräch.","id":"D3.3"},{"category":"Dating","skill":"Intention","level":4,"title":"Instant Nummer","trigger":"Geh auf jemanden zu: 'Ich finde deine Ausstrahlung toll – gib mir deine Nummer, dann trinken wir einen Kaffee.'","friction":"Direktes Risiko. Die maximale soziale Hürde: Das direkte 'Nein' innerhalb von Sekunden provozieren.","rule":"Ziel ist das Risiko, nicht die Nummer.","id":"D4.1"},{"id":"D4.2","category":"Dating","level":4,"title":"Sofort-Einladung","trigger":"Frag im Café/Park nach 10 Sek. Kontakt: 'Lust, jetzt sofort mit mir 10 Min. spazieren zu gehen?'","friction":"Spontaneität & Anspruch. Die sofortige Investition von Zeit fordern. Extrem hohe Ablehnungsrate.","rule":"Bleib entspannt bei einem 'Nein'. Ein 'Nein' ist lediglich die Bestätigung deines Mutes.","skill":"Intention"},{"id":"D4.3","category":"Dating","level":4,"title":"Korb-Sammeln","trigger":"Sprich jemanden an, bei dem du kein Interesse vermutest, nur um die Abfuhr souverän anzunehmen.","friction":"Resilienz-Training. Die komplette Abwesenheit von defensiver oder beleidigter Energie bei Ablehnung.","rule":"Antworte: 'Alles klar, schönen Tag noch!' und geh lächelnd weiter. Dein Wert bleibt unberührt.","skill":"Intention"},{"id":"P1.1","category":"Sozialer Alltag","level":1,"title":"The Anchor","trigger":"Bleib nach dem Bezahlen oder Kaffee-Erhalt für 15 Sek. ruhig am Tresen stehen und ordne deine Sachen.","friction":"Raum-Besetzung. Der innere Druck, sofort Platz für den Nächsten machen zu müssen.","rule":"Atme tief. Dein Tempo bestimmt die Realität am Tresen, nicht die Schlange hinter dir.","skill":"Presence"},{"id":"P1.2","category":"Sozialer Alltag","level":1,"title":"Center Stage","trigger":"Wähle im Café oder Restaurant den exponiertesten Tisch in der Mitte, statt dich an den Rand zu setzen.","friction":"Exposition. Das Gefühl, von allen Seiten beobachtet zu werden, ohne Schutz im Rücken.","rule":"Kein Handy. Schau 5 Min. einfach nur ruhig in den Raum. Sei präsent.","skill":"Presence"},{"id":"P1.3","category":"Sozialer Alltag","level":1,"title":"Unplugged Silence","trigger":"Sitz 10 Minuten an einem belebten Ort (Isar/Park) ohne Handy, Buch oder Musik. Nur du und die Umgebung.","friction":"Reiz-Entzug. Die Angst, ohne digitale Ablenkung \"unproduktiv\" oder \"alleine\" zu wirken.","rule":"Wenn Unruhe aufkommt: Registriere sie, bleib sitzen. Du bist die Base.","skill":"Presence"},{"id":"P2.1","category":"Sozialer Alltag","level":2,"title":"The Slow Walk","trigger":"Gehe heute durch eine belebte Straße (z.B. Kaufingerstraße) bewusst 30% langsamer als der Strom.","friction":"Social Pacing. Den instinktiven Drang unterdrücken, sich der Hektik anzupassen.","rule":"Kopf oben, Blick am Horizont. Du lässt dich nicht treiben, du navigierst.","skill":"Presence"},{"id":"P2.2","category":"Sozialer Alltag","level":2,"title":"Slow Motion Interaction","trigger":"Bewege deine Hände und deinen Körper bei einer Interaktion (z.B. Bestellen) mit halber Geschwindigkeit.","friction":"Körperbeherrschung. Hektik ist ein Zeichen von Unterlegenheit. Ruhe ist Macht.","rule":"Keine unnötigen Gesten. Jede Bewegung ist bewusst und präzise.","skill":"Presence"},{"id":"P2.3","category":"Sozialer Alltag","level":2,"title":"The Waiter Frame","trigger":"Wenn du im Restaurant bestellen willst, schau dem Kellner ruhig hinterher, bis er dich bemerkt, statt zu rufen oder zu winken.","friction":"Geduld-Dominanz. Den Frame halten, dass deine Zeit wertvoll ist, ohne bedürftig zu wirken.","rule":"Halte die Körperspannung aufrecht. Wer wartet, ohne nervös zu werden, führt.","skill":"Presence"},{"id":"P3.1","category":"Sozialer Alltag","level":3,"title":"Horizon Scan","trigger":"Halte den Blick für 2 Minuten konsequent auf Augenhöhe (Horizont), während du durch eine Menschenmenge läufst.","friction":"Soziale Blindheit. Den Drang unterdrücken, auf den Boden zu schauen oder Blicken auszuweichen.","rule":"Schau \"durch\" die Menschen hindurch, wenn kein Kontakt da ist. Absolute Blicktreue.","skill":"Presence"},{"id":"P3.2","category":"Sozialer Alltag","level":3,"title":"The Mirror Gaze","trigger":"Schau einer fremden Person im Vorbeilaufen so lange in die Augen, bis sie zuerst wegschaut.","friction":"Konfrontation. Die natürliche Hierarchie-Prüfung durch Blickkontakt gewinnen.","rule":"Kein Starren. Ein neutraler, entspannter Blick (Dominance, not Aggression).","skill":"Presence"},{"id":"P3.3","category":"Sozialer Alltag","level":3,"title":"The 360-View","trigger":"Bleib mitten auf einem belebten Platz stehen und dreh dich einmal ganz langsam um 360 Grad, während du alles betrachtest.","friction":"Mittelpunkt-Exposition. Sich selbst zum Zentrum der Szenerie machen.","rule":"Tu es so, als würdest du ein Grundstück besichtigen, das dir gehört.","skill":"Presence"},{"id":"P4.1","category":"Sozialer Alltag","level":4,"title":"The Street Pause","trigger":"Bleib mitten auf dem Gehweg einer belebten Straße stehen und schau für 60 Sek. auf deine (imaginäre) Uhr oder in den Himmel.","friction":"Flow-Unterbrechung. Den sozialen Fluss stören, ohne einen \"triftigen\" Grund zu haben.","rule":"Weiche den Leuten nicht aus. Sie werden um dich herumgehen. Bleib fest.","skill":"Presence"},{"id":"P4.2","category":"Sozialer Alltag","level":4,"title":"Front Row Presence","trigger":"Setz dich in einer Vorlesung, einem Workshop oder Event bewusst in die allererste Reihe, direkt vor den Sprecher.","friction":"Direkte Exposition. Die psychologische Hürde der ersten Reihe (Angst vor Interaktion).","rule":"Halte den Fokus beim Sprecher. Sei der präsenteste Zuhörer im Raum.","skill":"Presence"},{"id":"P4.3","category":"Sozialer Alltag","level":4,"title":"The Silent Entrance","trigger":"Betritt einen Raum (Bar/Meeting) und bleib 5 Sek. im Türrahmen stehen, bevor du dich bewegst oder jemanden grüßt.","friction":"Eintritts-Kontrolle. Den Moment des Erscheinens voll auskosten und markieren.","rule":"Scan den Raum ruhig ab. Du entscheidest, wann du den Raum betrittst.","skill":"Presence"},{"id":"W1.1","category":"Business","level":1,"title":"Zero Softener","trigger":"Bestelle etwas (Café/Bar) ohne „vielleicht“, „gerne“ oder „könnte ich“. Sag: „Ich nehme den Espresso.“","friction":"Direktheit. Verzicht auf verbale Schutzschilde und den Drang, „nett“ zu wirken.","rule":"Halte danach Blickkontakt, bis die Bestellung bestätigt ist. Kein Lückenfüller.","skill":"Wirkung"},{"id":"W1.2","category":"Business","level":1,"title":"Point Blank","trigger":"Beantworte eine Frage heute ausschließlich mit „Ja“ oder „Nein“, ohne eine zusätzliche Erklärung zu liefern.","friction":"Rechtfertigungs-Stopp. Das Gefühl aushalten, dass eine Erklärung „höflicher“ wäre.","rule":"Stille nach dem Wort ist dein Freund. Deine Antwort steht für sich.","skill":"Wirkung"},{"id":"W1.3","category":"Business","level":1,"title":"The Statement","trigger":"Ersetze „Ich glaube...“ oder „Ich finde...“ durch eine klare Behauptung: „Es ist so, dass...“","friction":"Überzeugung. Die eigene Meinung als Tatsache im Raum stehen lassen.","rule":"Deine Stimme sinkt am Ende des Satzes ab, statt wie bei einer Frage zu steigen.","skill":"Wirkung"},{"id":"W2.1","category":"Business","level":2,"title":"Volume Up","trigger":"Sprich bei einer Bestellung oder kurzen Frage 20% lauter als dein übliches Level.","friction":"Hörbarkeit. Die unterbewusste Angst vor der Aufmerksamkeit anderer Kunden.","rule":"Deine Stimme muss die Wände berühren. Nicht schreien, sondern projizieren.","skill":"Wirkung"},{"id":"W2.2","category":"Business","level":2,"title":"The Echo","trigger":"Wenn jemand deinen Namen ruft oder dich anspricht, antworte erst nach 2 Sekunden mit tiefer, ruhiger Stimme.","friction":"Reaktions-Kontrolle. Den automatischen „Helfersyndrom“-Impuls unterdrücken.","rule":"Du kontrollierst den Startpunkt der Kommunikation.","skill":"Wirkung"},{"id":"W2.3","category":"Business","level":2,"title":"Low-Pitch Intro","trigger":"Beginne ein Gespräch (auch Smalltalk) am unteren Ende deines Stimmspektrums (tiefer Ton).","friction":"Autorität. Tiefe Frequenzen signalisieren Gelassenheit und hohen Status.","rule":"Atme in den Bauch, bevor du den ersten Ton abgibst.","skill":"Wirkung"},{"id":"W3.1","category":"Business","level":3,"title":"The Pause","trigger":"Wenn dir jemand eine Frage stellt, warte bewusst 3 Sekunden, während du ihn anschaust, bevor du antwortest.","friction":"Kontrolle. Die soziale Erwartung einer sofortigen Reaktion aktiv brechen.","rule":"Nutze die Stille. Wer die Stille hält, führt das Gespräch.","skill":"Wirkung"},{"id":"W3.2","category":"Business","level":3,"title":"Eye-Lead","trigger":"Halte beim Sprechen den Blickkontakt, bis du deinen Satz komplett beendet hast. Schau erst danach weg.","friction":"Verbindung. Die Intensität des Moments bis zum Ende durchhalten.","rule":"Deine Augen sind der Anker deiner Worte. Lass sie nicht wandern.","skill":"Wirkung"},{"id":"W3.3","category":"Business","level":3,"title":"Interrupt-Stop","trigger":"Wenn dich jemand unterbricht, sprich einfach in deinem Tempo ruhig weiter, bis du deinen Satz beendet hast.","friction":"Geltungsanspruch. Sich nicht physisch oder akustisch verdrängen lassen.","rule":"Werde nicht lauter oder schneller. Bleib einfach in deinem Rhythmus.","skill":"Wirkung"},{"id":"W4.1","category":"Business","level":4,"title":"The Why-Question","trigger":"Wenn dich jemand zu etwas bittet, frag einmal freundlich aber bestimmt: „Warum ist das für dich wichtig?“","friction":"Filter-Funktion. Nicht sofort springen, sondern den Wert der Aufgabe prüfen.","rule":"Akzeptiere die Antwort nur, wenn sie für dich Sinn ergibt.","skill":"Wirkung"},{"id":"W4.2","category":"Business","level":4,"title":"The Clean Cut","trigger":"Beende ein Gespräch, wenn es für dich vorbei ist, mit: „Ich habe alles gehört. Danke.“ und geh.","friction":"Abschluss-Macht. Den sozialen Zwang, auf ein „natürliches“ Ende zu warten, kappen.","rule":"Sei höflich, aber bestimmt. Deine Zeit ist dein wertvollstes Gut.","skill":"Wirkung"},{"id":"W4.3","category":"Business","level":4,"title":"Frame-Correction","trigger":"Wenn jemand eine falsche Annahme über dich trifft, korrigiere sie sofort: „Das ist nicht korrekt. Die Lage ist so: …“","friction":"Wahrheits-Hoheit. Kleine Respektlosigkeiten oder Fehler nicht durchgehen lassen.","rule":"Bleib sachlich. Emotionen schwächen den Frame. Fakten stärken ihn.","skill":"Wirkung"}]</script>

<script>
const APP_LEVEL_NAMES={1:'Basis',2:'Kontakt',3:'Druck',4:'Maximum'};
let QL=[];
function sectorFromLifeCategory(cat){
  var t=String(cat||'').toLowerCase();
  if(t==='dating'||t==='date')return 'dating';
  if(t==='business'||t==='karriere')return 'business';
  if(t==='sozialer alltag'||t==='social'||t.indexOf('sozial')!==-1)return 'social';
  return 'dating';
}
function normalizeQuestRow(raw){
  if(!raw||raw.id==null)return null;
  var lv=parseInt(raw.level,10);
  if(isNaN(lv))lv=1;
  lv=Math.max(1,Math.min(4,lv));
  var id=String(raw.id||'');
  var rawCat=String(raw.category||'').trim();
  var lifeCat=rawCat||'Dating';
  var ck=rawCat.toLowerCase();
  if(ck==='intention'||ck==='presence'||ck==='wirkung'){
    if(id.charAt(0)==='D')lifeCat='Dating';
    else if(id.charAt(0)==='P')lifeCat='Sozialer Alltag';
    else if(id.charAt(0)==='W')lifeCat='Business';
    else lifeCat='Dating';
  }
  var sector=sectorFromLifeCategory(lifeCat);
  var skill=String(raw.skill||'').trim();
  if(!skill){
    if(ck==='intention')skill='Intention';
    else if(ck==='presence')skill='Presence';
    else if(ck==='wirkung')skill='Wirkung';
    else skill='Intention';
  }
  var title=String(raw.title||'');
  var trig=String(raw.trigger||'');
  var fric=String(raw.friction||'');
  var rule=String(raw.rule||'');
  var diff=Math.min(3,lv);
  return{
    id:id,
    category:lifeCat,
    skill:skill,
    level:lv,
    title:title,
    trigger:trig,
    friction:fric,
    rule:rule,
    sector:sector,
    cat:lifeCat,
    action:trig||title,
    diff:diff,
    style:'classic'
  };
}
/* Passende Icons pro Quest (Fallback bleibt nach Level, wenn ID unbekannt) */
var QUEST_ICONS_BY_ID={
  'D1.1':'👁️','D1.2':'📍','D1.3':'↩️',
  'D2.1':'💬','D2.2':'👗','D2.3':'😏',
  'D3.1':'🍸','D3.2':'👥','D3.3':'⏸️',
  'D4.1':'📱','D4.2':'🌳','D4.3':'🧺',
  'P1.1':'⚓','P1.2':'🎭','P1.3':'📵',
  'P2.1':'🐢','P2.2':'🎬','P2.3':'🍽️',
  'P3.1':'🌅','P3.2':'🪞','P3.3':'🌀',
  'P4.1':'🛑','P4.2':'🎓','P4.3':'🚪',
  'W1.1':'☕','W1.2':'✅','W1.3':'📣',
  'W2.1':'🔊','W2.2':'⏳','W2.3':'🎙️',
  'W3.1':'🤔','W3.2':'👁️','W3.3':'✋',
  'W4.1':'❓','W4.2':'✂️','W4.3':'🧭'
};
function applyQuestIcons(){
  var fb={1:'👁️',2:'💬',3:'🔥',4:'⚡'};
  QL.forEach(function(q){
    if(!q)return;
    if(q.icon)return;
    var id=String(q.id||'');
    if(QUEST_ICONS_BY_ID[id]){q.icon=QUEST_ICONS_BY_ID[id];return;}
    q.icon=fb[q.level]||'✨';
  });
}
function loadQuestLibraryFromData(d){
  QL=(Array.isArray(d)?d:[]).map(normalizeQuestRow).filter(Boolean);
}
function loadQuestsFromEmbed(){
  var el=document.getElementById('xl-quests-embed');
  if(!el)return false;
  try{
    var d=JSON.parse(el.textContent);
    if(!Array.isArray(d)||!d.length)return false;
    loadQuestLibraryFromData(d);
    return QL.length>0;
  }catch(e){return false;}
}
function loadQuestLibrary(){
  return fetch('data/quests.json')
    .then(function(r){if(!r.ok)throw new Error('quests');return r.json();})
    .then(function(d){
      loadQuestLibraryFromData(d);
      if(!QL.length)throw new Error('empty');
    })
    .catch(function(){
      if(!loadQuestsFromEmbed())QL=[];
    })
    .then(function(){
      applyQuestIcons();
      sanitizeTodayQueue();
      renderProfileQuestBento();
      var sq=document.getElementById('s-q');
      if(sq&&sq.classList.contains('on'))rOverview();
    });
}
function openProfileQuestDetail(q){
  if(!q)return;
  window._profileDetailQuest=q;
  var root=document.getElementById('quest-detail');if(!root)return;
  var lv=q.level!=null&&q.level!==''&&!isNaN(Number(q.level))?Math.max(1,Math.min(4,Number(q.level))):null;
  if(lv!=null)root.setAttribute('data-pq-lvl',String(lv));else root.removeAttribute('data-pq-lvl');
  var catEl=document.getElementById('det-cat');
  if(catEl)catEl.textContent=String(q.category||'').toUpperCase()+(q.skill?' · '+String(q.skill):'')+(lv!=null?' · L'+lv:'');
  var titleEl=document.getElementById('det-title');
  if(titleEl)titleEl.textContent=q.title||'';
  var tr=document.getElementById('det-trigger');
  if(tr)tr.textContent=q.trigger||(q.title||'');
  var fr=document.getElementById('det-friction');
  if(fr)fr.textContent=q.friction||'';
  var ru=document.getElementById('det-rule');
  if(ru)ru.textContent=q.rule||'';
  root.classList.add('on');
}
function openProfileQuestDetailById(id){
  var q=QL.find(function(x){return x&&x.id===id;});
  if(q)openProfileQuestDetail(q);
}
function closeDetail(){
  var root=document.getElementById('quest-detail');if(root){root.classList.remove('on');root.removeAttribute('data-pq-lvl');}
  window._profileDetailQuest=null;
}
function startQuest(){
  var q=window._profileDetailQuest;
  closeDetail();
  if(!q)return;
  addAndShame(q.id);
}
function questIcon(q){
  if(!q)return'✨';
  return q.icon||'✨';
}
const SECTOR_META={
  dating:{
    id:'dating',
    label:'Dating',
    desc:'Annäherung, Signal, Risiko',
    emoji:'💕',
    color:'var(--dating)'
  },
  business:{
    id:'business',
    label:'Business',
    desc:'Status, Klarheit, Rahmen',
    emoji:'💼',
    color:'var(--business)'
  },
  social:{
    id:'social',
    label:'Sozialer Alltag',
    desc:'Öffentlichkeit, Tempo, Nähe',
    emoji:'🌍',
    color:'var(--social)'
  }
};

const DIFF_META = {
  1:{label:'Safe',color:'#059669'},
  2:{label:'Spürbar',color:'#D97706'},
  3:{label:'Mutig',color:'#DC2626'},
};
function getUnlockedLevel(){return 4;}

let S = {totalDone:0,streak:0,lastLogin:null,completions:[],weekQueue:[],weekStart:null,weekDone:{},weekShame:{},activeSector:'all',ovLvl:'all',name:''};
function sv(){try{localStorage.setItem('xl7',JSON.stringify(S))}catch(e){}}
function ld(){try{const d=JSON.parse(localStorage.getItem('xl7')||'{}');if(Object.keys(d).length)Object.assign(S,d)}catch(e){}
  delete S.dailyMood;delete S.dailyScore;
  if('fCat' in S){
    var fc=S.fCat;
    delete S.fCat;
    if(fc==='Alle')S.ovLvl='all';
    else if(typeof fc==='number'&&fc>=0&&fc<=5)S.ovLvl=fc;
    else if(typeof fc==='string'){var pfc=parseInt(fc,10);if(!isNaN(pfc)&&pfc>=0&&pfc<=5)S.ovLvl=pfc;}
  }
  if(S.ovLvl==null||S.ovLvl==='')S.ovLvl='all';
  if(typeof S.ovLvl==='string'&&S.ovLvl!=='all'){var px=parseInt(S.ovLvl,10);S.ovLvl=isNaN(px)?'all':px;}
  if(S.ovLvl!=='all'&&(typeof S.ovLvl!=='number'||S.ovLvl<0||S.ovLvl>5))S.ovLvl='all';
  if('todayQueue'in S){if(!(S.weekQueue&&S.weekQueue.length))S.weekQueue=S.todayQueue||[];delete S.todayQueue;}
  delete S.lastShuffle;
  if((S.weekQueue||[]).length){
    S.weekDone=S.weekDone||{};
    S.weekQueue.forEach(function(qid){if(!S.weekDone[qid])S.weekDone[qid]=[0,0,0,0,0,0,0];});
    if(!S.weekStart)S.weekStart=getMonday();
  }
  if(typeof S.activeSector!=='string')S.activeSector='all';
  if(S.activeSector&&S.activeSector!=='all'&&!SECTOR_META[S.activeSector])S.activeSector='all';
  var _legacySectors=['intention','presence','wirkung'];
  if(_legacySectors.indexOf(S.activeSector)!==-1)S.activeSector='all';
}
function sanitizeTodayQueue(){const ok=new Set(QL.map(q=>q.id));S.weekQueue=(S.weekQueue||[]).filter(id=>ok.has(id));sv();}

function getMonday(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d.toDateString();
}

function getTodayDowIndex(){
  const d=new Date().getDay();
  return d===0?6:d-1;
}

const SCREENS = {home:'s-home',q:'s-q',stats:'s-stats'};
const td = new Date().toDateString();
const yd = new Date(Date.now()-864e5).toDateString();

function go(tab){
  if(tab==='levels')tab='q';
  Object.keys(SCREENS).forEach(t=>{document.getElementById(SCREENS[t]).classList.toggle('on',t===tab);const nb=document.getElementById('nt-'+t);if(nb)nb.classList.toggle('on',t===tab);});
  if(tab==='home')rHome();
  if(tab==='q')rOverview();
  if(tab==='stats')rStats();
}
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderProfileQuestBento(){
  var el=document.getElementById('hpq');if(!el)return;
  /* Volle Bibliothek gehört unter «Quests»; Home zeigt nur die Wochenwahl in #hqs. */
  el.innerHTML='';
}
function todayDoneIds(){return (S.completions||[]).filter(c=>new Date(c.ts).toDateString()===td).map(c=>c.qid);}
function dayKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function scoreClass(n){if(n>=2)return'g';if(n===1)return'y';return'r';}
function dayWeekDoneCount(dowIx){
  const wq=S.weekQueue||[];
  let n=0;
  for(let qi=0;qi<wq.length;qi++){
    const qid=wq[qi];
    if(((S.weekDone||{})[qid]||[])[dowIx])n++;
  }
  return n;
}

function shuffleQueue(){
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);
  const pool=QL.filter(q=>q.level<=unlockedLevel);

  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  const picks=[];
  const low=pool.filter(q=>q.level<=1);
  const mid=pool.filter(q=>q.level===2||q.level===3);
  const high=pool.filter(q=>q.level>=4);
  if(low.length)picks.push(low[0]);
  if(mid.length&&unlockedLevel>=2)picks.push(mid[0]);
  if(high.length&&unlockedLevel>=4)picks.push(high[0]);
  const used=picks.map(p=>p.id);
  for(const q of pool){
    if(picks.length>=3)break;
    if(!used.includes(q.id))picks.push(q);
  }

  S.weekQueue=picks.map(q=>q.id).slice(0,3);
  S.weekShame = {};
  S.weekStart=getMonday();
  S.weekDone={};
  S.weekQueue.forEach(qid=>{S.weekDone[qid]=[0,0,0,0,0,0,0];});
  sv();
}

function weekTrackerHtml(qid){
  const dowIdx=getTodayDowIndex();
  const done=S.weekDone?.[qid]||[0,0,0,0,0,0,0];
  const labels=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const cells=labels.map(function(lbl,i){
    const on=!!done[i];
    let ringClass='hq-wk-ring';
    let inner='';
    if(on){
      ringClass+=' hq-wk-ring--done';
      inner='✓';
    }else if(i===dowIdx){
      ringClass+=' hq-wk-ring--today';
      inner=escHtml(lbl.toUpperCase());
    }else if(i>dowIdx){
      ringClass+=' hq-wk-ring--future';
    }else{
      ringClass+=' hq-wk-ring--past';
    }
    return '<div class="hq-wk-cell"><div class="'+ringClass+'">'+inner+'</div><span class="hq-wk-lbl">'+lbl+'</span></div>';
  }).join('');
  return '<div class="hq-week-track"><div class="hq-wk-dots">'+cells+'</div></div>';
}

function rHome(){
  renderProfileQuestBento();
  S.weekQueue=S.weekQueue||[];
  if(S.weekQueue.length&&S.weekStart!=null&&S.weekStart!==getMonday())shuffleQueue();
  const totalQ=S.weekQueue.length;
  const dowIdx=getTodayDowIndex();
  const doneToday=(S.weekQueue||[]).filter(qid=>(S.weekDone?.[qid]||[])[dowIdx]===1).length;
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);

    const mondayOffset=todayDow===0?-6:1-todayDow;
    const monday=new Date(now);monday.setDate(now.getDate()+mondayOffset);
    monday.setHours(0,0,0,0);

</div>`;return;}

function ovFilteredQuests(){
  var active=S.activeSector;
  if(typeof active!=='string')active='all';
  if(active!=='all'&&!SECTOR_META[active])active='all';
  return QL.filter(function(q){
    if(active!=='all'&&q.sector!==active)return false;
    return true;
  });
}

function ovSetLvl(v){
  S.activeSector=(v==='all'||!v)?'all':v;
  sv();rOverview();
}

function rOverview(){
  const w=document.getElementById('ov-wrap');if(!w)return;
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);
  var active=S.activeSector||'all';
  var lvlChips='<button type="button" class="ov-chip ov-chip--diff'+(active==='all'?' on':'')+'" onclick="ovSetLvl(\'all\')">Alle</button>'
    +Object.keys(SECTOR_META).map(function(key){
      var on=active===key;
      var m=SECTOR_META[key];
      return '<button type="button" class="ov-chip ov-chip--diff'+(on?' on':'')+'" title="'+escHtml(m.label||'')+'" onclick="ovSetLvl(\''+key+'\')">'+escHtml((m.emoji||'')+' '+(m.label||key))+'</button>';
    }).join('');
  var qs=ovFilteredQuests();
  var cards=qs.length?qs.map(function(q){
    var skin=q.level<=1?'ov-card--diff-leicht':q.level===2?'ov-card--diff-mittel':'ov-card--diff-stark';
    var inQ=(S.weekQueue||[]).includes(q.id);
    var isLocked=q.level>unlockedLevel;

      ? '<button type="button" class="ov-card-go ov-card-go--muted" disabled>Gesperrt 🔒</button>'

        ? '<button type="button" class="ov-card-go" disabled>In Queue ✓</button>'

function saveQuestDone(){
  const qid=window._pendingQid;
  if(!qid)return;
  const q=QL.find(x=>x.id===qid);
  if(!q)return;

  const dowIdx=getTodayDowIndex();
  S.weekDone=S.weekDone||{};
  if(!S.weekDone[qid])S.weekDone[qid]=[0,0,0,0,0,0,0];
  S.weekDone[qid][dowIdx]=1;

  const reflection=
    (document.getElementById('ref-text')
    ?.value||'').trim();
  const outcome=window._selectedOutcome||'same';
  const visibility=
    window._selectedVisibility||'private';
  const shameBefore=
    (S.weekShame||{})[qid]||null;

  S.completions=S.completions||[];
  S.completions.push({
    qid,
    ts:Date.now(),
    reflection,
    outcome,
    visibility,
    shameBefore,
    sector:q.sector||'dating',
    diff:q.diff||1,
    level:q.level||1,
    title:q.title||''
  });

  S.totalDone=(S.totalDone||0)+1;

  // Streak
  if(S.lastLogin!==td){
    if(S.lastLogin===yd)
      S.streak=(S.streak||0)+1;
    else S.streak=1;
    S.lastLogin=td;
  }

  window._pendingQid=null;
  window._selectedOutcome=null;
  window._selectedVisibility='private';

  sv();
  closeSheet();
  showCel(q);
  setTimeout(rHome,400);
}
