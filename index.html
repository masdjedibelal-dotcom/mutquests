    <div style="font-family:'DM Mono',monospace;
      font-size:9px;font-weight:700;color:var(--t3);
      letter-spacing:0.1em;margin-bottom:8px">
      🤝 FAIR-PLAY-REGEL
    </div>
    <div style="font-family:'DM Sans',sans-serif;
      font-size:13px;color:var(--t2);line-height:1.6">
      Freundlich bleiben. Jedes Nein sofort
      akzeptieren. Kein Druck, keine Erklärung,
      kein zweiter Versuch.
    </div>
  </div>`;

  showSheet(`
    <div class="qc-sheet">
      <button type="button" class="qc-close-sheet" onclick="closeSheet()" aria-label="Schließen">✕</button>
      <div class="shdl"></div>
      <div class="qc-head">
        <div class="qc-head-row">
          <div class="qc-head-ico">${questIcon(q)}</div>
          <div class="qc-head-meta">
            <span class="qc-dots-wrap">
              <span class="qc-dot qc-dot--on"></span>
              <span class="qc-dot qc-dot--on"></span>
              <span class="qc-dot qc-dot--on"></span>
              <span class="qc-dot"></span>
              <span class="qc-dot"></span>
            </span>
            ${questPillHtml(q)}
          </div>
        </div>
        <div class="qc-head-title">${escHtml(q.title)}</div>
        <div class="qc-head-sub">${escHtml(q.category||'')} · ${escHtml(q.skill||'')} · L${q.level} · ${escHtml(dm.label||'')}</div>
      </div>
      <div class="qc-scroll">
        ${triggerBlock}
        ${frictionBlock}
        ${ruleBlock}
        ${fairplayBlock}
      </div>
      <div class="qc-foot">
        ${inQueue
          ? `<button type="button" class="qc-btn qc-btn--primary" onclick="closeSheet();showShameCheck('${qid}')">Ich mach's heute →</button>
             <button type="button" class="qc-btn qc-btn--ghost" onclick="closeSheet()">Schließen</button>`
          : `<button type="button" class="qc-btn qc-btn--primary" onclick="closeSheet();addAndShame('${qid}')">Quest annehmen →</button>
             <button type="button" class="qc-btn qc-btn--ghost" onclick="closeSheet()">Schließen</button>`
        }
      </div>
    </div>
  `,'sht--qc');
}

function rLevels(){
  const w=document.getElementById('levels-wrap');
  if(!w)return;

  const active=S.activeSector||'all';

  // Filter Chips
  const chips=['all',...Object.keys(SECTOR_META)]
    .map(key=>{
      const isAll=key==='all';
      const meta=isAll
        ?{label:'Alle',emoji:'⚡'}
        :SECTOR_META[key];
      const isOn=active===key;
      return`<button onclick="setSector('${key}')"
        style="flex-shrink:0;border:none;
        border-radius:99px;padding:8px 16px;
        font-family:'DM Sans',sans-serif;
        font-size:12px;font-weight:700;
        cursor:pointer;transition:all .15s;
        background:${isOn?'var(--t)':'var(--surface2)'};
        color:${isOn?'#fff':'var(--t2)'}">
        ${meta.emoji} ${meta.label}
      </button>`;
    }).join('');

  // Gefilterte Quests
  const filtered=QL.filter(q=>
    active==='all'||q.sector===active
  );

  // Quests gruppiert nach Diff
  const byDiff={1:[],2:[],3:[]};
  filtered.forEach(q=>{
    if(byDiff[q.diff])byDiff[q.diff].push(q);
  });

  // Quest Rows
  function questRow(q){
    const dm=DIFF_META[q.diff]||DIFF_META[1];
    const sm=SECTOR_META[q.sector]||{};
    const inQueue=(S.weekQueue||[]).includes(q.id);
    const doneBefore=(S.completions||[])
      .some(c=>c.qid===q.id);

    return`<div style="display:flex;align-items:center;
      gap:12px;padding:12px 0;
      border-bottom:0.5px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:6px;
          align-items:center;margin-bottom:4px">
          <span style="font-family:'DM Mono',monospace;
            font-size:8px;font-weight:700;
            padding:2px 8px;border-radius:99px;
            background:${dm.color}15;color:${dm.color}">
            ${dm.label}
          </span>
          <span style="font-family:'DM Mono',monospace;
            font-size:8px;color:var(--t3)">
            ${sm.emoji||''} ${sm.label||''}
          </span>
        </div>
        <div style="font-family:'DM Sans',sans-serif;
          font-size:14px;font-weight:700;color:var(--t);
          ${doneBefore?'opacity:0.5':''}">
          ${escHtml(q.title)}
        </div>
      </div>
      ${inQueue
        ?`<span style="font-family:'DM Mono',monospace;
            font-size:8px;color:var(--am);font-weight:700;
            white-space:nowrap">DIESE WOCHE</span>`
        :`<button onclick="addToWeekQueue('${q.id}')"
            style="background:var(--t);border:none;
            border-radius:10px;padding:7px 12px;
            font-family:'DM Mono',monospace;font-size:9px;
            font-weight:700;color:#fff;cursor:pointer;
            white-space:nowrap;flex-shrink:0">
            + Woche
          </button>`
      }
    </div>`;
  }

  // Diff-Gruppen zusammenbauen
  let questsHtml='';
  [1,2,3].forEach(diff=>{
    const qs=byDiff[diff];
    if(!qs.length)return;
    const dm=DIFF_META[diff];
    questsHtml+=`
      <div style="margin-bottom:24px">
        <div style="font-family:'DM Mono',monospace;
          font-size:9px;font-weight:700;
          color:${dm.color};letter-spacing:0.1em;
          margin-bottom:4px;padding-top:16px">
          ${dm.label.toUpperCase()} — LEVEL ${diff}
        </div>
        <div style="font-family:'DM Sans',sans-serif;
          font-size:11px;color:var(--t3);
          margin-bottom:8px">
          ${{1:'Fast kein Risiko — guter Einstieg',
             2:'Andere merken es — es kribbelt',
             3:'Hohes Risiko für ein Nein oder Scham'}[diff]}
        </div>
        ${qs.map(questRow).join('')}
      </div>`;
  });

  w.innerHTML=`
    <!-- Filter Chips -->
    <div style="display:flex;gap:8px;
      overflow-x:auto;padding-bottom:12px;
      margin-bottom:4px">
      ${chips}
    </div>

    <!-- Quest Liste -->
    ${questsHtml||`
      <div style="text-align:center;padding:40px 20px;
        font-family:'DM Sans',sans-serif;
        font-size:13px;color:var(--t3)">
        Keine Quests in diesem Bereich.
      </div>
    `}
  `;
}

function setSector(key){
  S.activeSector=key;
  sv();
  rLevels();
}
function addToWeekQueue(qid){
  S.weekQueue=S.weekQueue||[];
  if(S.weekQueue.length>=3){
    showSheet(`
      <div class="shdl"></div>
      <div class="sht-t">Schon 3 Quests aktiv</div>
      <div class="sht-s">Entferne zuerst eine Quest
        auf der Startseite.</div>
      <button class="btn-sv" onclick="closeSheet();go('home')">
        Zur Startseite
      </button>
    `);
    return;
  }
  if(S.weekQueue.includes(qid))return;
  S.weekQueue.push(qid);
  S.weekDone=S.weekDone||{};
  S.weekDone[qid]=[0,0,0,0,0,0,0];
  sv();
  rLevels();
  rHome();
}

  const current=(S.name||'').trim();

    <div class="sht-t">Profilname</div>
    <div class="sht-s">Dieser Name wird im Profil angezeigt.</div>
    <div class="sht-sc">
      <input id="profile-name-input" class="wf-wz-field" maxlength="28" placeholder="Dein Name" value="${escHtml(current)}" />

function confirmResetAll(){
  try{localStorage.removeItem('xl7')}catch(e){}
  location.reload();
}
function rStats(){
  const w=document.getElementById('stats-wrap');if(!w)return;
  const total=S.totalDone||0;
  const streak=S.streak||0;
  const unlockedLevel=getUnlockedLevel(total);
  const rawName=(S.name||'').trim();
  const displayName=rawName||'Dein Name';
  const avatar=(displayName&&displayName!=='Dein Name')?displayName.charAt(0).toUpperCase():'?';

  const now=new Date();
  const day=now.getDay();
  const diff=day===0?-6:1-day;
  const monday=new Date(now);
  monday.setDate(now.getDate()+diff);
  monday.setHours(0,0,0,0);
  const todayIdx=getTodayDowIndex();
  const weekCounts=[0,0,0,0,0,0,0];
  (S.completions||[]).forEach(function(c){
    const d=new Date(c.ts);
    if(d<monday)return;
    const idx=(d.getDay()===0?6:d.getDay()-1);
    if(idx>=0&&idx<7)weekCounts[idx]++;
  });
  const weekTotal=weekCounts.reduce((a,b)=>a+b,0);
  const weekMax=Math.max(1,...weekCounts);
  const dayNames=['Mo','Di','Mi','Do','Fr','Sa','So'];

  const latest=(S.completions||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,8);
  function relDate(ts){
    const d=new Date(ts);
    const t=new Date();
    const td=new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();
    const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    const diffDays=Math.round((td-dd)/86400000);
    if(diffDays===0)return 'Heute';
    if(diffDays===1)return 'Gestern';
    return dayNames[(d.getDay()===0?6:d.getDay()-1)];
  }

  const weekBars=weekCounts.map(function(n,i){
    const h=Math.max(10,Math.round((n/weekMax)*92));
    const active=i===todayIdx;
    const barStyle=active
      ? 'background:linear-gradient(180deg,#F0ABFC,#C084FC);box-shadow:0 6px 14px rgba(192,132,252,.35);'
      : 'background:var(--surface2);';
    const lblColor=active?'var(--t)':'var(--t3)';
    return '<div style="flex:1;min-width:0;text-align:center">'
      +'<div style="font-family:var(--font-mono);font-size:10px;color:'+(active?'var(--am)':'var(--t3)')+';margin-bottom:4px">'+n+'</div>'
      +'<div style="height:96px;display:flex;align-items:flex-end;justify-content:center">'
      +'<div style="width:100%;max-width:42px;height:'+h+'px;border-radius:12px;'+barStyle+'"></div></div>'
      +'<div style="font-family:var(--font-sans);font-size:12px;font-weight:'+(active?'800':'600')+';color:'+lblColor+';margin-top:8px">'+dayNames[i]+'</div></div>';
  }).join('');

  const latestHtml=latest.length?latest.map(function(c){
    const lvl=(c.level==null?0:c.level);
    return '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(17,24,39,0.07)">'
      +'<div style="width:40px;height:40px;border-radius:20px;background:rgba(5,150,105,.12);display:flex;align-items:center;justify-content:center;color:var(--g);font-size:22px;flex-shrink:0">✓</div>'
      +'<div style="flex:1;min-width:0"><div style="font-family:var(--font-sans);font-size:15px;font-weight:700;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(c.title||'Quest')+'</div>'
      +'<div style="font-family:var(--font-sans);font-size:12px;color:var(--t3);margin-top:2px">'+relDate(c.ts)+'</div></div>'
      +'<span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#A78BFA;background:rgba(196,181,253,.25);padding:7px 12px;border-radius:999px">Lv.'+lvl+'</span>'
      +'</div>';
  }).join(''):'<div style="font-family:var(--font-sans);font-size:13px;color:var(--t3);padding:6px 2px">Noch keine Quests erledigt.</div>';

  // Nur anzeigen wenn mindestens 3 Completions
  // mit shameBefore Wert vorhanden
  const withShame=(S.completions||[])
    .filter(c=>c.shameBefore&&c.outcome);
  let realityHtml='';
  if(withShame.length>=3){
    const avgShame=(withShame
      .reduce((s,c)=>s+(c.shameBefore||0),0)
      /withShame.length).toFixed(1);

    const betterCount=withShame
      .filter(c=>c.outcome==='better').length;
    const neinCount=withShame
      .filter(c=>c.outcome==='nein').length;
    const betterPct=Math.round(
      betterCount/withShame.length*100);

    realityHtml='<div class="sblock" style="margin-bottom:12px">'
      +'<div class="sbt">ERWARTUNG VS. REALITÄT</div>'
      +'<div style="font-family:var(--font-sans);font-size:13px;color:var(--t2);line-height:1.6;margin-top:6px">Durchschnittliche Anspannung vorher: <b style="color:var(--t)">'+avgShame+'/4</b></div>'
      +'<div style="font-family:var(--font-sans);font-size:13px;color:var(--t2);line-height:1.6">'+betterPct+'% waren besser als erwartet</div>'
      +'<div style="font-family:var(--font-sans);font-size:13px;color:var(--t2);line-height:1.6">'+neinCount+' mal ein Nein bekommen und überlebt</div>'
      +(betterPct>70?'<div style="margin-top:10px;background:rgba(5,150,105,0.08);border-radius:12px;padding:10px 12px;font-family:var(--font-sans);font-size:12px;color:var(--t2);line-height:1.5"><b style="color:var(--t)">Insight:</b> Dein Gehirn überschätzt die Gefahr fast immer.</div>':'')
      +'</div>';
  }

  w.innerHTML=''
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
    +'<button type="button" class="hm-side" onclick="openProfileSettings()" aria-label="Einstellungen" style="color:var(--t3)">'
    +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    +'<circle cx="12" cy="12" r="3"></circle>'
    +'<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>'
    +'</svg></button>'
    +'<button type="button" class="hm-side" onclick="openResetSheet()" aria-label="Reset" style="color:#DC2626">'
    +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
    +'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>'
    +'<polyline points="10 17 15 12 10 7"></polyline>'
    +'<line x1="15" y1="12" x2="3" y2="12"></line>'
    +'</svg></button></div>'
    +'<div style="text-align:center;margin-bottom:14px">'
    +'<div style="width:112px;height:112px;border-radius:56px;margin:0 auto 10px;background:linear-gradient(135deg,#F0ABFC,#C084FC);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:52px;font-weight:800;color:#fff">'+escHtml(avatar)+'</div>'
    +'<div style="font-family:var(--font-sans);font-size:34px;font-weight:800;letter-spacing:-0.02em;color:var(--t)">'+escHtml(displayName)+'</div>'
    +'<div style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(196,181,253,.25);font-family:var(--font-mono);font-size:12px;font-weight:700;color:#A78BFA;margin-top:6px">LV. '+unlockedLevel+' '+escHtml(APP_LEVEL_NAMES[unlockedLevel]||'')+'</div>'
    +'</div>'

    +'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px">'
    +'<div class="sblock" style="padding:12px 10px;text-align:center"><div style="font-size:24px;line-height:1">✓</div><div class="sv" style="margin-top:6px">'+total+'</div><div class="sl">ERLEDIGT</div></div>'
    +'<div class="sblock" style="padding:12px 10px;text-align:center"><div style="font-size:24px;line-height:1">🔥</div><div class="sv" style="margin-top:6px;color:var(--am)">'+streak+'</div><div class="sl">STREAK</div></div>'
    +'<div class="sblock" style="padding:12px 10px;text-align:center"><div style="font-size:24px;line-height:1">⭐</div><div class="sv" style="margin-top:6px;color:#A78BFA">'+unlockedLevel+'</div><div class="sl">LEVEL</div></div>'
    +'</div>'
    +realityHtml

    +'<div class="sblock" style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div class="sbt">Diese Woche</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--t3)">'+weekTotal+' QUESTS</div></div>'
    +'<div style="display:flex;gap:8px">'+weekBars+'</div></div>'

    +'<div class="sblock" style="margin-bottom:12px"><div class="sbt" style="margin-bottom:4px">Zuletzt gemacht</div>'+latestHtml+'</div>'

    +'<div class="sblock"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div class="sbt">🗺️ Avoidance Map</div><span style="font-family:var(--font-mono);font-size:10px;color:#A78BFA;background:rgba(196,181,253,.25);padding:4px 10px;border-radius:999px">BETA</span></div><div style="font-family:var(--font-sans);font-size:14px;color:var(--t2)">Folgt in der nächsten Version.</div></div>';
}

  c.style.display='block';
  c.style.pointerEvents='all';
  const ck=questIcon(q);
  c.innerHTML='<div class="cel-ov"><div class="cel-box"><div class="cel-ck">'+ck+'</div><div class="cel-t">Quest erledigt!</div><div class="cel-s">Jede Handlung verändert das Muster. Rep #'+(S.totalDone||1)+'.</div><div style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--t3);margin-bottom:16px">'+escHtml(q.title||'')+'</div><button class="btn-cel" onclick="closeCel()">Weiter →</button></div></div>';

}
function closeCel(){const c=document.getElementById('cel');if(c){c.style.display='none';c.style.pointerEvents='none';}}

});
