<script type="application/json" id="rt-quests-json">[{"id":"RT00_01","level":0,"cat":"Präsenz","title":"Blickkontakt nicht sofort abbrechen","action":"Wenn sich heute zufällig Blickkontakt ergibt, halte ihn eine halbe Sekunde länger als dein Reflex will. Dann schaust du ruhig weiter.","variants":["Bei einer fremden Person auf der Straße.","Bei einer Serviceperson beim Bestellen.","Bei einer Frau, die dir auffällt.","In einem Café oder Laden.","Im Fitnessstudio oder in der Umkleide."],"goal":"Das Ziel ist nicht starren. Das Ziel ist nicht sofort ausweichen.","safety":"No-Go: Aggressiv starren oder jemanden fixieren.","modminus":"Nur bei kurzer Service-Interaktion.","modplus":"Mit leichtem Lächeln halten.","style":"classic"},{"id":"RT00_02","level":0,"cat":"Präsenz","title":"Blickkontakt + leichtes Lächeln","action":"Wenn du heute mit einer sympathischen Person oder Frau kurzen Blickkontakt hast, halte ihn kurz, lächle leicht und schau ruhig weiter.","variants":["Beim Vorbeigehen auf der Straße.","Im Café.","Im Supermarkt.","Im Gym.","An der Kasse."],"goal":"Das Ziel ist nicht flirten müssen. Das Ziel ist freundlich sichtbar bleiben.","safety":"No-Go: Hinterher starren oder übertreiben.","modminus":"Nur leicht lächeln.","modplus":"Zusätzlich kurz Hallo sagen.","style":"classic"},{"id":"RT00_03","level":0,"cat":"Präsenz","title":"Warten ohne Handy-Flucht","action":"Setz dich heute 3 Minuten in ein Café, an eine Haltestelle oder auf eine Bank und nimm dein Handy nicht raus. Schau dich ruhig um und bleib im Moment.","variants":["An einer Haltestelle.","In einem Café.","Auf einer Parkbank.","In einer Warteschlange.","In einer Lobby oder Wartezone."],"goal":"Das Ziel ist nicht Meditation. Das Ziel ist Anwesenheit ohne Ablenkung aushalten.","safety":"No-Go: Sofort Handy checken sobald es unangenehm wird.","modminus":"1 Minute ohne Handy.","modplus":"5 Minuten ohne Handy und ohne Kopfhörer.","style":"classic"},{"id":"RT00_04","level":0,"cat":"Präsenz","title":"Augenfarbe-Check","action":"Halte beim Bestellen oder Bezahlen genug Blickkontakt, dass du danach sagen könntest, welche Augenfarbe die Person hatte.","variants":["Beim Kaffee bestellen.","Beim Bezahlen im Supermarkt.","Beim Gespräch mit einem Kellner.","Beim Empfang oder Check-in.","Bei einer kurzen Frage im Laden."],"goal":"Das Ziel ist nicht starren. Das Ziel ist präsent bleiben statt ausweichen.","safety":"No-Go: Unnatürlich fixieren.","modminus":"Nur einmal kurz bewusst Blickkontakt.","modplus":"Während eines ganzen Satzes Blickkontakt halten.","style":"classic"},{"id":"RT00_05","level":0,"cat":"Präsenz","title":"Hallo in halb-offenen Räumen","action":"Sag heute einmal klar Hallo in einer Situation, wo es passen würde, aber viele es vermeiden.","variants":["Im Aufzug.","In der Fitness-Umkleide.","Im Hausflur.","In einem kleinen Laden.","Im Wartezimmer.","Beim Betreten eines kleinen Cafés."],"goal":"Das Ziel ist nicht ein Gespräch. Das Ziel ist soziale Initiative in einem kleinen Moment.","safety":"No-Go: Nuschelnd oder mit Blick nach unten grüßen.","modminus":"Nur nicken und lächeln.","modplus":"Hallo sagen und Blickkontakt halten.","style":"classic"},{"id":"RT00_06","level":0,"cat":"Präsenz","title":"Ohne Weichmacher bestellen","action":"Bestell heute einmal klar und ruhig: „Ich nehme bitte X.“ Kein vielleicht, kein könnte ich eventuell, kein leiser Ton.","variants":["Im Café.","Beim Bäcker.","Im Imbiss.","Im Restaurant.","An einer Bar."],"goal":"Das Ziel ist nicht unhöflich sein. Das Ziel ist klar sprechen ohne dich klein zu machen.","safety":"No-Go: Danach lachen oder dich entschuldigen.","modminus":"Nur einen Satz klar sagen.","modplus":"Zusätzlich 20% langsamer sprechen.","style":"classic"},{"id":"RT01_01","level":1,"cat":"Mini-Kontakt","title":"Frag nach einer unnötigen Info","action":"Sprich heute eine fremde Person an und frag nach einer einfachen Information, die du eigentlich selbst herausfinden könntest.","variants":["Frag nach der Uhrzeit, obwohl du dein Handy hast.","Frag nach dem Weg zu einem Ort in der Nähe.","Frag nach Öffnungszeiten, obwohl sie irgendwo stehen.","Frag nach dem Preis, obwohl er angeschrieben ist.","Frag nach einem Produkt, obwohl du es fast siehst.","Frag, ob du hier richtig bist für eine bestimmte Richtung."],"goal":"Das Ziel ist nicht die Information. Das Ziel ist den ersten Satz zu einem fremden Menschen sagen.","safety":"No-Go: Direkt erklären, dass du es eigentlich weißt.","modminus":"Frag eine Serviceperson.","modplus":"Frag einen Passanten auf der Straße.","style":"classic"},{"id":"RT01_02","level":1,"cat":"Mini-Kontakt","title":"Frag nach einer Empfehlung","action":"Frag heute eine fremde Person oder Serviceperson nach einer persönlichen Empfehlung.","variants":["Frag im Café: „Was trinken Sie hier selbst am liebsten?“","Frag im Restaurant: „Was würden Sie persönlich nehmen?“","Frag einen Passanten nach einem Café-Tipp.","Frag im Buchladen nach dem Lieblingsbuch eines Mitarbeiters.","Frag jemanden nach einem Song, den du heute hören solltest.","Frag im Laden, welches Produkt die Person besser findet."],"goal":"Das Ziel ist nicht die Empfehlung. Das Ziel ist jemanden kurz in deinen Moment einzubinden.","safety":"No-Go: Die Frage stellen und sofort weglaufen.","modminus":"Frag eine Serviceperson.","modplus":"Frag eine fremde Person außerhalb eines Servicekontexts.","style":"classic"},{"id":"RT01_03","level":1,"cat":"Mini-Kontakt","title":"Teile einen Situationssatz","action":"Sag heute zu einer fremden Person einen einfachen Satz über etwas, das ihr beide gerade wahrnehmt.","variants":["In der Warteschlange: „Heute ist hier echt viel los.“","Im Aufzug: „Der fährt heute aber langsam.“","Beim Hund: „Der hat ja richtig Energie.“","Im Café: „Die Musik hier ist heute echt gut.“","Draußen: „Das Wetter weiß heute auch nicht, was es will.“","In der Bahn: „Heute ist es ungewöhnlich voll.“"],"goal":"Das Ziel ist nicht ein Gespräch. Das Ziel ist einen sozialen Ball kurz ins Feld werfen.","safety":"No-Go: Nach dem Satz sofort wegschauen.","modminus":"Nur bei einer harmlosen Situation.","modplus":"Eine kleine Folgefrage anhängen.","style":"classic"},{"id":"RT01_04","level":1,"cat":"Mini-Kontakt","title":"Frag nach einer kleinen Entscheidung","action":"Bitte heute jemanden kurz um Hilfe bei einer kleinen Entscheidung.","variants":["„Würden Sie eher das oder das nehmen?“","„Wirkt das eher casual oder schick?“","„Welches Foto wirkt sympathischer?“","„Welches Café würden Sie nehmen?“","„Apfel oder Banane?“","„Welche Farbe finden Sie besser?“"],"goal":"Das Ziel ist nicht die Entscheidung. Das Ziel ist jemanden aktiv einbinden.","safety":"No-Go: Sofort erklären, dass es egal ist.","modminus":"Frag eine Serviceperson.","modplus":"Frag einen Fremden auf der Straße.","style":"classic"},{"id":"RT01_05","level":1,"cat":"Mini-Kontakt","title":"Mach ein konkretes kleines Lob","action":"Sag heute einer Person ein kurzes, konkretes Lob für etwas, das dir wirklich auffällt.","variants":["„Der Kaffee war richtig gut.“","„Sie waren gerade echt freundlich.“","„Die Musik hier passt richtig gut.“","„Die Einrichtung hier ist schön.“","„Das ging gerade echt schnell, danke.“","„Coole Jacke.“"],"goal":"Das Ziel ist nicht schmeicheln. Das Ziel ist etwas Positives aussprechen, statt es nur zu denken.","safety":"No-Go: Danach lachen oder es kleinmachen.","modminus":"Lob an Serviceperson.","modplus":"Lob an fremde Person im Vorbeigehen.","style":"classic"},{"id":"RT02_01","level":2,"cat":"Kleine Bitte","title":"Bitte um ein kleines Extra","action":"Frag heute bei einer Bestellung nach einem kleinen Extra, das nicht automatisch dabei ist.","variants":["Frag nach einem Glas Leitungswasser.","Frag nach einer extra Serviette.","Frag nach Eiswürfeln.","Frag nach Zitrone.","Frag nach extra Sauce.","Frag nach einer kleinen Tüte oder Verpackung."],"goal":"Das Ziel ist nicht das Extra. Das Ziel ist aktiv mehr verlangen als Standard.","safety":"No-Go: Dich sofort entschuldigen, wenn die Person zögert.","modminus":"Frag nach etwas sehr Normalem.","modplus":"Frag nach etwas leicht Ungewöhnlichem.","style":"classic"},{"id":"RT02_02","level":2,"cat":"Kleine Bitte","title":"Bitte um kleine Hilfe","action":"Bitte heute eine fremde Person um eine kleine konkrete Hilfe.","variants":["Frag, ob jemand dir ein Foto machen kann.","Frag, ob jemand kurz einen Stift hat.","Frag, ob jemand dir Münzen wechseln kann.","Frag, ob jemand kurz auf deine Tasche schaut, während du etwas holst.","Frag, ob jemand dir kurz eine Richtung bestätigt.","Frag, ob jemand dir kurz etwas vom oberen Regal gibt."],"goal":"Das Ziel ist nicht die Hilfe. Das Ziel ist die Bitte ruhig stellen.","safety":"No-Go: Wertgegenstände oder unangenehme Nähe verlangen.","modminus":"Frag Servicepersonal.","modplus":"Frag einen Passanten.","style":"classic"},{"id":"RT02_03","level":2,"cat":"Kleine Bitte","title":"Frag nach einer Sonderlösung","action":"Frag heute freundlich, ob etwas leicht anders möglich ist als vorgesehen.","variants":["Frag, ob du ein Gericht anders kombinieren kannst.","Frag, ob du den ruhigsten Tisch bekommen kannst.","Frag, ob du kurz dein Handy laden darfst.","Frag, ob du etwas probieren darfst.","Frag, ob du eine kleinere Portion bekommen kannst.","Frag, ob du eine Sache kurz sehen oder testen darfst."],"goal":"Das Ziel ist nicht die Sonderlösung. Das Ziel ist vom Standard abweichen und fragen.","safety":"No-Go: Bei der ersten Unsicherheit sofort zurückrudern.","modminus":"Frag nach einer plausiblen Sonderlösung.","modplus":"Frag nach einer ungewöhnlichen Sonderlösung.","style":"classic"},{"id":"RT02_04","level":2,"cat":"Kleine Bitte","title":"Frag nach einem kleinen Vorteil","action":"Frag heute beim Bezahlen oder Bestellen nach einem kleinen Vorteil, Rabatt oder Deal.","variants":["„Gibt es heute einen kleinen Rabatt?“","„Gibt es einen geheimen Deal, den ich kennen sollte?“","„Gibt es heute etwas gratis dazu?“","„Gibt es einen Sympathie-Rabatt?“","„Gibt es einen Vorteil, wenn ich direkt bar zahle?“","„Kann man da preislich noch etwas machen?“"],"goal":"Das Ziel ist nicht der Rabatt. Das Ziel ist die Frage stellen und ein Nein entspannt annehmen.","safety":"No-Go: Sofort sagen: „War nur Spaß.“","modminus":"Frag spielerisch bei kleinem Betrag.","modplus":"Frag ernst bei einer offiziellen Kasse.","style":"classic"},{"id":"RT02_05","level":2,"cat":"Kleine Bitte","title":"Bitte um eine Mini-Ausnahme","action":"Frag heute freundlich nach einer kleinen Ausnahme, ohne dich dafür zu entschuldigen.","variants":["„Wäre es ausnahmsweise möglich, das so zu machen?“","„Könnte ich das kurz testen?“","„Darf ich kurz sehen, wie das gemacht wird?“","„Könnten Sie das heute einmal anders machen?“","„Gibt es eine flexible Lösung?“","„Wäre eine kleine Ausnahme drin?“"],"goal":"Das Ziel ist nicht die Ausnahme. Das Ziel ist eine Bitte stellen, die abgelehnt werden darf.","safety":"No-Go: Die Bitte als Scherz tarnen.","modminus":"Frag bei einer kleinen Sache.","modplus":"Frag bei einer offiziellen Person.","style":"classic"},{"id":"RT03_01","level":3,"cat":"Meinung & Feedback","title":"Frag nach Feedback zu deinem Auftreten","action":"Frag nach einer kurzen Interaktion eine Person nach 10 Sekunden ehrlichem Feedback dazu, wie du gerade gewirkt hast.","variants":["„Kurze Frage: Wirkte ich gerade klar oder unsicher?“","„War meine Stimme gut hörbar?“","„Kam meine Frage normal rüber?“","„Wirkte ich eher entspannt oder nervös?“","„Darf ich kurz Feedback haben, wie ich gerade gewirkt habe?“"],"goal":"Das Ziel ist nicht gutes Feedback. Das Ziel ist Bewertung zulassen.","safety":"No-Go: Die Antwort sofort erklären oder verteidigen.","modminus":"Frag jemanden, der dir sympathisch wirkt.","modplus":"Frag eine fremde Person.","style":"classic"},{"id":"RT03_02","level":3,"cat":"Meinung & Feedback","title":"Frag nach Meinung zu etwas Sichtbarem","action":"Frag heute jemanden nach ehrlicher Meinung zu etwas, das mit dir zu tun hat.","variants":["Frag nach deinem Outfit.","Frag nach einem Profilfoto.","Frag nach einer kurzen Bio.","Frag nach einer Idee.","Frag nach einem Satz oder Titel.","Frag nach deiner Stimme oder Wirkung."],"goal":"Das Ziel ist nicht die perfekte Meinung. Das Ziel ist dich selbst kurz bewerten lassen.","safety":"No-Go: Nur nach Lob suchen.","modminus":"Frag jemanden, den du ein bisschen kennst.","modplus":"Frag eine fremde Person.","style":"classic"},{"id":"RT03_03","level":3,"cat":"Meinung & Feedback","title":"Nimm eine fremde Empfehlung wirklich an","action":"Frag heute eine Serviceperson nach ihrer persönlichen Empfehlung und nimm diese dann wirklich.","variants":["Lieblingskaffee.","Lieblingsgericht.","Lieblingsdrink.","Lieblingsbuch.","Lieblingsprodukt.","Lieblingsdessert."],"goal":"Das Ziel ist nicht die beste Wahl. Das Ziel ist Kontrolle abgeben.","safety":"No-Go: Nach der Empfehlung doch wieder deine sichere Option nehmen.","modminus":"Nimm eine kleine Empfehlung.","modplus":"Nimm etwas, das du normalerweise nicht wählen würdest.","style":"classic"},{"id":"RT03_04","level":3,"cat":"Meinung & Feedback","title":"Lass einen Fremden entscheiden","action":"Lass heute eine fremde Person eine kleine Entscheidung für dich treffen.","variants":["Welchen Kaffee du nimmst.","Welche Süßigkeit du kaufst.","Welchen Song du hörst.","Welchen Weg du nimmst.","Welches Foto du nutzt.","Welche Farbe du wählst."],"goal":"Das Ziel ist nicht die Entscheidung. Das Ziel ist Kontrolle für einen kleinen Moment loslassen.","safety":"No-Go: Danach sofort alles ändern.","modminus":"Nur zwischen zwei Optionen wählen lassen.","modplus":"Die Person komplett frei entscheiden lassen.","style":"classic"},{"id":"RT04_01","level":4,"cat":"Sichtbarkeit","title":"Laut und langsam bestellen","action":"Bestell heute bewusst 20% lauter und langsamer als sonst. Nicht nuscheln, nicht kleiner werden.","variants":["Im Café.","Beim Bäcker.","Im Restaurant.","An der Bar.","Im Imbiss."],"goal":"Das Ziel ist nicht laut sein. Das Ziel ist klar hörbar sein ohne dich zu entschuldigen.","safety":"No-Go: Danach leiser werden, wenn jemand schaut.","modminus":"Nur einen Satz lauter sprechen.","modplus":"Die ganze Bestellung ruhig und klar halten.","style":"classic"},{"id":"RT04_02","level":4,"cat":"Sichtbarkeit","title":"Solo-Präsenz ohne Handy","action":"Setz dich heute allein an einen sichtbaren Platz und nimm 5 Minuten kein Handy raus.","variants":["Zentraler Tisch im Café.","Bank in der Fußgängerzone.","Tisch im Foodcourt.","Platz an der Bar.","Allein im Restaurant."],"goal":"Das Ziel ist nicht entspannen. Das Ziel ist sichtbar allein sein ohne Schutz.","safety":"No-Go: Handy, Kopfhörer oder Buch als Schutz benutzen.","modminus":"3 Minuten.","modplus":"10 Minuten.","style":"classic"},{"id":"RT04_03","level":4,"cat":"Sichtbarkeit","title":"Kompliment-Drop","action":"Geh auf eine Person zu, sag ein kurzes konkretes Kompliment und geh danach ruhig weiter.","variants":["„Coole Jacke.“","„Dein Stil sieht richtig gut aus.“","„Die Schuhe sind stark.“","„Das Outfit passt richtig gut.“","„Du hast eine gute Ausstrahlung.“"],"goal":"Das Ziel ist nicht die Reaktion. Das Ziel ist etwas Positives direkt aussprechen.","safety":"No-Go: Danach lachen, relativieren oder hektisch fliehen.","modminus":"Bei jemandem, den du ein bisschen kennst.","modplus":"Bei einer fremden Person.","style":"classic"},{"id":"RT04_04","level":4,"cat":"Sichtbarkeit","title":"Foto-Request","action":"Frag heute eine fremde Person, ob sie kurz ein Foto von dir machen kann.","variants":["Vor einem Gebäude.","In einem Café.","An einem schönen Spot.","Im Park.","In einer Einkaufsstraße."],"goal":"Das Ziel ist nicht das Foto. Das Ziel ist einen Fremden aktiv in deine Sache einbinden.","safety":"No-Go: Direkt sagen, dass es egal ist.","modminus":"Frag eine Person, die entspannt wirkt.","modplus":"Sag genau, wie das Foto aussehen soll.","style":"classic"},{"id":"RT04_05","level":4,"cat":"Ablehnung","title":"Frag nach 1 Euro für etwas Banales","action":"Frag heute einen Passanten freundlich, ob er dir 1 Euro schenken kann — für ein Eis, einen Kaffee oder etwas Banales.","variants":["„Könnten Sie mir 1 Euro für ein Eis schenken?“","„Haben Sie zufällig 1 Euro für meinen Kaffee übrig?“","„Ich sammle gerade 1 Euro für einen Snack.“"],"goal":"Das Ziel ist nicht der Euro. Das Ziel ist ein mögliches Nein ruhig aushalten.","safety":"No-Go: Druck machen oder mitleidig wirken.","modminus":"Frag im Freundeskreis absurd.","modplus":"Frag einen fremden Passanten.","style":"classic"},{"id":"RT04_06","level":4,"cat":"Ablehnung","title":"Frag nach einem Blick hinter die Kulissen","action":"Frag in einem Café, Laden oder Servicepunkt, ob du kurz sehen darfst, wie etwas hinter den Kulissen aussieht.","variants":["„Darf ich kurz sehen, wie der Kaffee gemacht wird?“","„Darf ich kurz hinter die Theke schauen?“","„Darf ich sehen, wie ihr das zubereitet?“","„Darf ich kurz einen Blick in den Arbeitsbereich werfen?“"],"goal":"Das Ziel ist nicht der Blick. Das Ziel ist eine ungewöhnliche Bitte ruhig stellen.","safety":"No-Go: Sofort erklären, dass es nur eine Challenge ist.","modminus":"Frag nach Erklärung statt Blick.","modplus":"Frag wirklich nach kurzem Blick.","style":"classic"},{"id":"RT04_07","level":4,"cat":"Ablehnung","title":"Frag, ob du dich dazusetzen darfst","action":"Frag jemanden, der allein an einem größeren Tisch sitzt, ob du dich kurz dazusetzen darfst.","variants":["Im Café.","In einer Mensa.","In einem Foodcourt.","Im Park an einer Bank.","In einer Bibliothek oder Coworking-Zone."],"goal":"Das Ziel ist nicht der Platz. Das Ziel ist eine soziale Grenze freundlich testen.","safety":"No-Go: Aufdringlich bleiben, wenn die Person nein sagt.","modminus":"Frag, ob der Platz frei ist.","modplus":"Frag, ob du dich wirklich kurz dazusetzen darfst.","style":"classic"},{"id":"RT04_08","level":4,"cat":"Ablehnung","title":"Frag nach einer kleinen Ausnahme","action":"Frag heute nach einer kleinen Ausnahme, ohne dich lang zu erklären.","variants":["„Könnten Sie heute eine kleine Ausnahme machen?“","„Wäre das ausnahmsweise möglich?“","„Gibt es irgendeine flexible Lösung?“","„Kann man das einmal anders machen?“"],"goal":"Das Ziel ist nicht die Ausnahme. Das Ziel ist die Frage stehen lassen.","safety":"No-Go: Sofort zurückrudern, wenn die Person nachfragt.","modminus":"Frag bei einer kleinen Sache.","modplus":"Frag bei einer offiziellen Person.","style":"classic"},{"id":"RT05_01","level":5,"cat":"Fun Mode","title":"Frag nach einem Burger Refill","action":"Frag bei Fast-Food oder Imbiss höflich, ob es für den Burger auch ein kostenloses Refill gibt wie beim Getränk.","variants":["Burger Refill.","Pommes Refill.","Döner Refill.","Croissant Refill.","Kaffee mit unendlichem Nachschub."],"goal":"Das Ziel ist nicht das Refill. Das Ziel ist eine absurde Frage mit ernstem Gesicht stellen.","safety":"No-Go: Personal lächerlich machen oder provozieren.","modminus":"Frag mit leichtem Lächeln.","modplus":"Frag völlig ernst.","style":"fun"},{"id":"RT05_02","level":5,"cat":"Fun Mode","title":"Frag nach der Glücksmomente-Abteilung","action":"Frag im Supermarkt oder Laden ernst, wo du die Abteilung für Glücksmomente findest.","variants":["Glücksmomente.","Motivation zum Mitnehmen.","Selbstvertrauen in Dosen.","Mut für unterwegs.","Gute Laune im Angebot."],"goal":"Das Ziel ist nicht die Antwort. Das Ziel ist eine absurde Frage ohne Erklärung aushalten.","safety":"No-Go: Danach sofort lachen und erklären.","modminus":"Frag mit freundlichem Lächeln.","modplus":"Frag komplett ernst.","style":"fun"},{"id":"RT05_03","level":5,"cat":"Fun Mode","title":"High-Five Lotto","action":"Lauf mit erhobener Hand durch einen belebten Ort und schau, wer im Vorbeigehen einschlägt.","variants":["Fußgängerzone.","Uni-Campus.","Park.","Event-Warteschlange.","Vor einem Stadion oder Konzert."],"goal":"Das Ziel ist nicht das High-Five. Das Ziel ist sichtbar spielerisch sein.","safety":"No-Go: Menschen berühren, die nicht reagieren.","modminus":"Nur eine Person aktiv fragen.","modplus":"Mit erhobener Hand 20 Meter gehen.","style":"fun"},{"id":"RT05_04","level":5,"cat":"Fun Mode","title":"Ampel-Klatscher","action":"Klatsche einmal laut in die Hände und sag „Ja!“, genau wenn eine Ampel auf Grün springt.","variants":["An einer Fußgängerampel.","An einer kleinen Kreuzung.","Mit anderen Wartenden.","Allein an der Ampel.","Nach langer Wartezeit."],"goal":"Das Ziel ist nicht feiern. Das Ziel ist kurz peinlich sein und normal weitergehen.","safety":"No-Go: Andere erschrecken oder anschreien.","modminus":"Nur leise „Yes“ sagen.","modplus":"Klatschen und sichtbar freuen.","style":"fun"},{"id":"RT05_05","level":5,"cat":"Fun Mode","title":"Zeitreisender","action":"Frag jemanden ernst, welches Jahr wir gerade haben. Reagiere kurz überrascht und geh dann ruhig weiter.","variants":["„Welches Jahr haben wir gerade?“","„Ist es wirklich schon 2026?“","„Bin ich hier richtig in diesem Jahr?“"],"goal":"Das Ziel ist nicht Schauspiel. Das Ziel ist eine absurde soziale Situation ruhig halten.","safety":"No-Go: Menschen verfolgen, erschrecken oder lange irritieren.","modminus":"Frag eine Serviceperson spielerisch.","modplus":"Frag eine fremde Person draußen.","style":"fun"},{"id":"RT05_06","level":5,"cat":"Fun Mode","title":"Sieges-Kaffee","action":"Wenn du deinen Kaffee oder dein Essen bekommst, sag deutlich: „Yes, geschafft.“ Dann lächelst du und bedankst dich normal.","variants":["Beim Kaffee.","Beim Döner.","Beim Eis.","Beim Bäcker.","Beim Take-away."],"goal":"Das Ziel ist nicht Theater. Das Ziel ist einen kleinen absurden Moment erzeugen und nicht erklären.","safety":"No-Go: Zu laut oder störend werden.","modminus":"Nur leise „Yes“ sagen.","modplus":"Mit kleiner Siegergeste.","style":"fun"}]</script>
<script>
const RT_CATS = ['Präsenz','Mini-Kontakt','Kleine Bitte','Meinung & Feedback','Sichtbarkeit','Ablehnung','Fun Mode'];
const RT_LEVELS = {0:'Präsenz ohne Flucht',1:'Mini-Kontakt',2:'Kleine Bitte',3:'Meinung & Feedback',4:'Sichtbarkeit & Rejection',5:'Fun / Hard Mode'};
const QL = JSON.parse(document.getElementById('rt-quests-json').textContent);
const LEVEL_META = {
  0:{name:RT_LEVELS[0],desc:'',color:'#059669',emoji:'🌱'},
  1:{name:RT_LEVELS[1],desc:'',color:'#0891B2',emoji:'👋'},
  2:{name:RT_LEVELS[2],desc:'',color:'#D97706',emoji:'🙏'},
  3:{name:RT_LEVELS[3],desc:'',color:'#7C3AED',emoji:'💬'},
  4:{name:RT_LEVELS[4],desc:'',color:'#DC2626',emoji:'👁️'},
  5:{name:RT_LEVELS[5],desc:'',color:'#EC4899',emoji:'🎭'},
};
const LEVEL_UNLOCK = {0:0,1:5,2:15,3:30,4:50,5:75};
function getUnlockedLevel(totalDone){let level=0;Object.entries(LEVEL_UNLOCK).forEach(([lvl,needed])=>{if(totalDone>=needed)level=parseInt(lvl,10);});return level;}

let S = {totalDone:0,streak:0,lastLogin:null,completions:[],weekQueue:[],weekStart:null,weekDone:{},currentLevel:0,ovLvl:'all',dailyMood:{},dailyScore:{}};
function sv(){try{localStorage.setItem('xl7',JSON.stringify(S))}catch(e){}}
function ld(){try{const d=JSON.parse(localStorage.getItem('xl7')||'{}');if(Object.keys(d).length)Object.assign(S,d)}catch(e){}
  if('fCat' in S){
    var fc=S.fCat;
    delete S.fCat;
    if(RT_CATS.indexOf(fc)!==-1||fc==='Alle')S.ovLvl='all';
    else if(typeof fc==='number'&&fc>=0&&fc<=5)S.ovLvl=fc;
    else if(typeof fc==='string'){var pfc=parseInt(fc,10);if(!isNaN(pfc)&&pfc>=0&&pfc<=5)S.ovLvl=pfc;}
  }
  if(S.ovLvl==null||S.ovLvl==='')S.ovLvl='all';
  if(typeof S.ovLvl==='string'&&S.ovLvl!=='all'){var px=parseInt(S.ovLvl,10);S.ovLvl=isNaN(px)?'all':px;}
  if(S.ovLvl!=='all'&&(typeof S.ovLvl!=='number'||S.ovLvl<0||S.ovLvl>5))S.ovLvl='all';
  if('todayQueue'in S){if(!(S.weekQueue&&S.weekQueue.length))S.weekQueue=S.todayQueue||[];delete S.todayQueue;}
  delete S.lastShuffle;
  if((S.weekQueue||[]).length){
    S.weekDone=S.weekDone||{};
    S.weekQueue.forEach(function(qid){if(!S.weekDone[qid])S.weekDone[qid]=[0,0,0,0,0,0,0];});
    if(!S.weekStart)S.weekStart=getMonday();
  }
  sanitizeTodayQueue();}
function sanitizeTodayQueue(){const ok=new Set(QL.map(q=>q.id));S.weekQueue=(S.weekQueue||[]).filter(id=>ok.has(id));sv();}

function getMonday(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d.toDateString();
}

function getTodayDowIndex(){
  const d=new Date().getDay();
  return d===0?6:d-1;
}

const SCREENS = {home:'s-home',q:'s-q',stats:'s-stats'};
const td = new Date().toDateString();
const yd = new Date(Date.now()-864e5).toDateString();

function go(tab){
  if(tab==='levels')tab='q';
  Object.keys(SCREENS).forEach(t=>{document.getElementById(SCREENS[t]).classList.toggle('on',t===tab);const nb=document.getElementById('nt-'+t);if(nb)nb.classList.toggle('on',t===tab);});
  if(tab==='home')rHome();
  if(tab==='q')rOverview();
  if(tab==='stats')rStats();
}
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayDoneIds(){return (S.completions||[]).filter(c=>new Date(c.ts).toDateString()===td).map(c=>c.qid);}
function dayKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function scoreClass(n){if(n>=2)return'g';if(n===1)return'y';return'r';}

function shuffleQueue(){
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);
  const pool=QL.filter(q=>q.level<=unlockedLevel);

  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  const picks=[];
  const low=pool.filter(q=>q.level<=1);
  const mid=pool.filter(q=>q.level===2||q.level===3);
  const high=pool.filter(q=>q.level>=4);
  if(low.length)picks.push(low[0]);
  if(mid.length&&unlockedLevel>=2)picks.push(mid[0]);
  if(high.length&&unlockedLevel>=4)picks.push(high[0]);
  const used=picks.map(p=>p.id);
  for(const q of pool){
    if(picks.length>=3)break;
    if(!used.includes(q.id))picks.push(q);
  }

  S.weekQueue=picks.map(q=>q.id).slice(0,3);
  S.weekStart=getMonday();
  S.weekDone={};
  S.weekQueue.forEach(qid=>{S.weekDone[qid]=[0,0,0,0,0,0,0];});
  sv();
}

function weekDotsHtml(qid){
  const dowIdx=getTodayDowIndex();
  const done=S.weekDone?.[qid]||[0,0,0,0,0,0,0];
  const dots=done.map(function(on,i){
    let bg,border='none';
    if(i===dowIdx){
      bg=on?'#059669':'#111111';
    }else if(on){
      bg='#059669';
    }else if(i<dowIdx){
      bg='var(--surface2)';
      border='0.5px dashed var(--t3)';
    }else{
      bg='var(--surface2)';
    }
    return '<div style="width:14px;height:14px;border-radius:50%;background:'+bg+';border:'+border+';flex-shrink:0"></div>';
  }).join('');
  return '<div style="display:flex;gap:3px;margin-top:6px;margin-bottom:10px">'+dots+'</div>';
}

function rHome(){
  S.weekQueue=S.weekQueue||[];
  if(S.weekQueue.length&&S.weekStart!=null&&S.weekStart!==getMonday())shuffleQueue();
  const totalQ=S.weekQueue.length;
  const dowIdx=getTodayDowIndex();
  const doneToday=(S.weekQueue||[]).filter(qid=>(S.weekDone?.[qid]||[])[dowIdx]===1).length;
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);
  const homeLvl=document.getElementById('home-level-copy');if(homeLvl)homeLvl.textContent='Lv. '+unlockedLevel+' · '+RT_LEVELS[unlockedLevel];
  const pct=totalQ>0?Math.round(doneToday/totalQ*100):0;
  const kDone=document.getElementById('kpi-done-val');if(kDone)kDone.textContent=String(S.streak||0);
  const xpWrap=document.querySelector('#s-home .kpi-xp');
  if(xpWrap)xpWrap.style.display=totalQ===0?'none':'';
  const fill=document.getElementById('kpi-xp-fill');if(fill)fill.style.width=pct+'%';
  const lbl=document.getElementById('kpi-xp-lbl');if(lbl)lbl.textContent='HEUTE · '+doneToday+' VON '+totalQ+' ERLEDIGT';
  S.dailyScore=S.dailyScore||{};
  S.dailyMood=S.dailyMood||{};
  S.dailyScore[dayKey(new Date())]=scoreClass(doneToday);
  const moodNow=S.dailyMood[dayKey(new Date())]||'🙂';
  const moodPrev=document.getElementById('kpi-mood-preview');if(moodPrev)moodPrev.textContent=moodNow;
  const wk=document.getElementById('kpi-week');if(wk){
    const names=['So','Mo','Di','Mi','Do','Fr','Sa'];
    const now=new Date();
    const todayDow=now.getDay();
    const mondayOffset=todayDow===0?-6:1-todayDow;
    const monday=new Date(now);monday.setDate(now.getDate()+mondayOffset);
    const parts=[];
    for(let i=0;i<7;i++){
      const d=new Date(monday);d.setDate(monday.getDate()+i);
      const key=dayKey(d);
      const isToday=d.toDateString()===now.toDateString();
      const isFuture=d>now;
      const cls=isFuture?'future':(S.dailyScore[key]||'r');
      parts.push('<div class="kpi-dcell"><div class="kpi-dayring '+cls+(isToday?' today-sel':'')+'"><p class="kpi-dlbl'+(isToday?' today':'')+'">'+names[d.getDay()]+'</p><p class="kpi-dd">'+String(d.getDate()).padStart(2,'0')+'</p></div><div class="kpi-dmood">'+(S.dailyMood[key]||'')+'</div></div>');
    }
    wk.innerHTML=parts.join('');
  }
  sv();
  const qs=document.getElementById('hqs');if(!qs)return;
  if(!(S.weekQueue||[]).length){qs.innerHTML=`<div style="text-align:center;padding:40px 20px">
  <div style="font-size:32px;margin-bottom:12px">📭</div>
  <div style="font-family:'DM Sans',sans-serif;font-size:17px;
    font-weight:700;color:var(--t);margin-bottom:8px">
    Keine Quests aktiv
  </div>
  <div style="font-family:'DM Sans',sans-serif;font-size:13px;
    color:var(--t2);line-height:1.6;margin-bottom:24px">
    Wähle Quests aus deinem Level<br/>
    oder lass die App für dich wählen.
  </div>
  <button onclick="shuffleQueue();rHome()"
    style="width:100%;background:var(--t);border:none;
    border-radius:14px;padding:14px;
    font-family:'DM Sans',sans-serif;font-size:14px;
    font-weight:700;color:#fff;cursor:pointer;
    margin-bottom:10px">
    🎲 3 Quests für mich wählen
  </button>
  <button onclick="go('levels')"
    style="width:100%;background:var(--surface2);border:none;
    border-radius:14px;padding:14px;
    font-family:'DM Sans',sans-serif;font-size:14px;
    font-weight:600;color:var(--t2);cursor:pointer">
    Selbst auswählen →
  </button>
</div>`;return;}
  const rows=(S.weekQueue||[]).map(function(qid){
    const q=QL.find(function(x){return x.id===qid;});if(!q)return'';
    const isDoneToday=(S.weekDone?.[q.id]||[])[dowIdx]===1;
    const heuteBtn=isDoneToday
      ? '<button type="button" onclick="event.stopPropagation();questDoneToday(\''+qid+'\')" style="flex:1;background:rgba(5,150,105,0.1);border:none;border-radius:14px;padding:13px;font-family:\'DM Sans\',sans-serif;font-size:13px;font-weight:700;color:#059669;cursor:pointer">✓ Heute gemacht</button>'
      : '<button type="button" onclick="event.stopPropagation();questDoneToday(\''+qid+'\')" style="flex:1;background:var(--t);border:none;border-radius:14px;padding:13px;font-family:\'DM Sans\',sans-serif;font-size:13px;font-weight:700;color:#fff;cursor:pointer">✓ Heute machen</button>';
    return '<div class="hq-row">'
      +'<div class="hq-copy" style="flex:1;min-width:0">'
      +'<div class="hq-meta">'+escHtml(q.cat||'')+' · L'+q.level+'</div>'
      +'<button type="button" class="hq-row-tap" onclick="showQuestDetail(\''+qid+'\')" style="width:100%">'
      +'<div class="hq-ico">'+(q.style==='fun'?'🎭':'⚡')+'</div>'
      +'<div style="flex:1;min-width:0;text-align:left">'
      +'<div class="hq-title" style="'+(isDoneToday?'text-decoration:line-through;opacity:.5':'')+'">'+escHtml(q.title)+'</div>'
      +'</div></button>'
      +weekDotsHtml(q.id)
      +'<div class="hq-sub">'+escHtml(q.action||'')+'</div>'
      +'</div>'
      +'<div class="hq-act" style="width:auto;min-width:132px;align-items:stretch;align-self:stretch">'
      +heuteBtn
      +'<button type="button" class="hq-xskip" onclick="event.stopPropagation();removeFromQueue(\''+qid+'\')" title="Entfernen">✕</button></div></div>';
  }).join('');
  qs.innerHTML='<div class="hq-list-card"><div class="hq-list-hd">Heute ein Level weiter?</div>'+rows+'<div class="hq-card-foot"><span style="font-family:DM Mono,monospace;font-size:9px;color:var(--t3)">'+doneToday+'/'+totalQ+' erledigt</span><button type="button" class="hq-foot-link" onclick="reshuffleHome()">↺ Neue Woche</button></div></div>';
}
function openMoodPicker(){
  const opts=['😄','🙂','😐','😮‍💨','😵','😤'];
  showSheet('<div class="shdl"></div><div class="sht-t">Wie fühlst du dich heute?</div><div class="sht-s">Wähle dein Tagesgefühl.</div><div class="sht-sc"><div style="display:flex;gap:10px;flex-wrap:wrap">'+opts.map(function(e){return '<button type="button" class="kpi-mood-btn" onclick="setTodayMood(\''+e+'\')">'+e+'</button>';}).join('')+'</div></div><button class="qc-btn qc-btn--ghost" onclick="closeSheet()">Schließen</button>');
}
function setTodayMood(emo){
  S.dailyMood=S.dailyMood||{};
  S.dailyMood[dayKey(new Date())]=emo;
  sv();
  closeSheet();
  rHome();
}

function ovFilteredQuests(){
  return QL.filter(function(q){
    if(S.ovLvl!=='all'&&q.level!==S.ovLvl)return false;
    return true;
  });
}

function ovSetLvl(v){
  if(v==='all'||v==='Alle')S.ovLvl='all';
  else{var n=typeof v==='number'?v:parseInt(v,10);S.ovLvl=isNaN(n)?'all':Math.min(5,Math.max(0,n));}
  sv();rOverview();
}

function rOverview(){
  const w=document.getElementById('ov-wrap');if(!w)return;
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);
  var lvlChips='<button type="button" class="ov-chip ov-chip--diff'+(S.ovLvl==='all'?' on':'')+'" onclick="ovSetLvl('+JSON.stringify('all')+')">Alle</button>'
    +[0,1,2,3,4,5].map(function(n){
      var on=S.ovLvl===n;
      return '<button type="button" class="ov-chip ov-chip--diff'+(on?' on':'')+'" title="'+escHtml(RT_LEVELS[n]||'')+'" onclick="ovSetLvl('+n+')">L'+n+'</button>';
    }).join('');
  var qs=ovFilteredQuests();
  var cards=qs.length?qs.map(function(q){
    var skin=q.level<=1?'ov-card--diff-leicht':q.level<=3?'ov-card--diff-mittel':'ov-card--diff-stark';
    var inQ=(S.weekQueue||[]).includes(q.id);
    var isLocked=q.level>unlockedLevel;
    var btn=isLocked
      ? '<button type="button" class="ov-card-go ov-card-go--muted" disabled>Gesperrt 🔒</button>'
      : inQ
        ? '<button type="button" class="ov-card-go" disabled>In Queue ✓</button>'
        : '<button type="button" class="ov-card-go" onclick="addToWeekQueue(\''+q.id+'\')">Start Quest →</button>';
    return '<article class="ov-card '+skin+'"><button type="button" class="ov-card-tap" onclick="showQuestDetail(\''+q.id+'\')"><div class="ov-card-top"><div class="ov-card-ico">'+(q.style==='fun'?'🎭':'⚡')+'</div><span class="ov-card-diff">'+escHtml(q.cat||'')+' · L'+q.level+'</span></div><div class="ov-card-title">'+escHtml(q.title)+'</div></button><div class="ov-card-foot"><span class="ov-card-time">'+escHtml(RT_LEVELS[q.level]||'')+'</span>'+btn+'</div></article>';
  }).join(''):'<div class="ov-empty">Keine Quests für diese Filter.</div>';
  w.innerHTML='<div class="ov-chip-sticky"><div class="ov-chip-row">'+lvlChips+'</div></div><div class="ov-scroll-list">'+cards+'</div>';
}
function reshuffleHome(){shuffleQueue();rHome();}
function removeFromQueue(qid){
  S.weekQueue=(S.weekQueue||[]).filter(id=>id!==qid);
  if(S.weekDone)delete S.weekDone[qid];
  sv();
  rHome();
}

function questDoneToday(qid){
  const dowIdx=getTodayDowIndex();
  S.weekDone=S.weekDone||{};
  if(!S.weekDone[qid])S.weekDone[qid]=[0,0,0,0,0,0,0];

  if(S.weekDone[qid][dowIdx]){
    S.weekDone[qid][dowIdx]=0;
    sv();rHome();return;
  }

  S.weekDone[qid][dowIdx]=1;
  S.totalDone=(S.totalDone||0)+1;
  S.currentLevel=getUnlockedLevel(S.totalDone);

  if(S.lastLogin!==td){
    if(S.lastLogin===yd)S.streak=(S.streak||0)+1;
    else S.streak=1;
    S.lastLogin=td;
  }

  S.completions=S.completions||[];
  S.completions.push({
    qid,ts:Date.now(),
    level:(QL.find(q=>q.id===qid)||{}).level||0,
    title:(QL.find(q=>q.id===qid)||{}).title||''
  });

  sv();
  showCel(QL.find(q=>q.id===qid)||{title:'Quest'});
  setTimeout(rHome,400);
}

function questPillHtml(q){
  if(q.style==='fun'||q.cat==='Fun Mode')return '<span class="qc-pill qc-pill--fun">FUN</span>';
  if(q.cat==='Ablehnung')return '<span class="qc-pill qc-pill--mut">MUT</span>';
  if(q.cat==='Sichtbarkeit')return '<span class="qc-pill qc-pill--action">SICHTBAR</span>';
  if(q.level<=1)return '<span class="qc-pill qc-pill--fund">BASIS</span>';
  return '<span class="qc-pill qc-pill--action">KONTAKT</span>';
}
function showQuestDetail(qid){
  const q=QL.find(x=>x.id===qid);if(!q)return;
  const unlockedLevel=getUnlockedLevel(S.totalDone||0);
  const isLocked=q.level>unlockedLevel;
  const needLock=isLocked?Math.max(0,(LEVEL_UNLOCK[q.level]||0)-(S.totalDone||0)):0;
  const lockBanner=isLocked?`<div class="qc-lock-banner">🔒 Diese Quest kannst du erst <strong>spielen</strong>, wenn <strong>Level ${q.level}</strong> frei ist${needLock>0?' — noch <strong>'+needLock+'</strong> Gesamt-Quests bis dahin':''}.</div>`:'';
  const doneToday=(S.weekDone?.[qid]||[])[getTodayDowIndex()]===1;
  const vars=(q.variants||[]).map(function(v){return '<li>'+escHtml(v)+'</li>';}).join('');
  const variantsBlock=vars?`<div class="qc-card qc-card--trigger"><div class="qc-card-hd qc-card-hd--trigger">✨ VARIANTEN</div><ul class="qc-variant-list">${vars}</ul></div>`:'';
  const safetyBlock=q.safety?`<div class="qc-card qc-card--nogo"><div class="qc-card-hd qc-card-hd--nogo">🚫 NO-GO</div><div class="qc-card-body">${escHtml(q.safety)}</div></div>`:'';
  const goalBlock=q.goal?`<div class="qc-card" style="background:rgba(5,150,105,0.06);border:1px solid rgba(5,150,105,0.15)"><div class="qc-card-hd" style="color:var(--g)">🎯 ZIEL</div><div class="qc-card-body">${escHtml(q.goal)}</div></div>`:'';
  const modMinus=q.modminus?`<div class="qc-mod-row"><div class="qc-mod-ico qc-mod-ico--minus">−</div><p class="qc-mod-txt"><strong>Leichter:</strong> ${escHtml(q.modminus)}</p></div>`:'';
  const modPlus=q.modplus?`<div class="qc-mod-row"><div class="qc-mod-ico qc-mod-ico--plus">+</div><p class="qc-mod-txt"><strong>Schwerer:</strong> ${escHtml(q.modplus)}</p></div>`:'';
  const modBlock=(modMinus||modPlus)?`<div class="qc-card qc-card--mod"><div class="qc-card-hd qc-card-hd--mod">🎚 MODIFIER</div>${modMinus}${modPlus}</div>`:'';
  showSheet(
    `<div class="qc-sheet">
      <div class="shdl"></div>
      <div class="qc-head">
        <div class="qc-head-row">
          <div class="qc-head-ico">💡</div>
          <div class="qc-head-meta">
            <span class="qc-dots-wrap">
              <span class="qc-dot qc-dot--on"></span>
              <span class="qc-dot qc-dot--on"></span>
              <span class="qc-dot qc-dot--on"></span>
              <span class="qc-dot"></span>
              <span class="qc-dot"></span>
            </span>
            ${questPillHtml(q)}
          </div>
        </div>
        <div class="qc-head-title">${escHtml(q.title)}</div>
        <div class="qc-head-sub">${escHtml(q.cat||'')+' · Level '+q.level+' · '+escHtml(RT_LEVELS[q.level]||'')}</div>
      </div>
      <div class="qc-scroll">
        ${lockBanner}
        ${variantsBlock}
        <div class="qc-card qc-card--action">
          <div class="qc-card-hd qc-card-hd--action">📍 WAS ZU TUN IST</div>
          <div class="qc-card-body">${escHtml(q.action)}</div>
        </div>
        ${goalBlock}
        ${safetyBlock}
        ${modBlock}
      </div>
      <div class="qc-foot">
        ${isLocked
          ? '<button type="button" class="qc-btn qc-btn--ghost" onclick="closeSheet()">Schließen</button>'
          : doneToday
            ? '<button type="button" class="qc-btn qc-btn--ghost" onclick="closeSheet()">Heute erledigt ✓</button>'
            : `<button type="button" class="qc-btn qc-btn--primary" onclick="closeSheet();questDoneToday('${qid}')">Quest annehmen</button>
               <button type="button" class="qc-btn qc-btn--ghost" onclick="closeSheet()">Schließen</button>`}
      </div>
    </div>`,
    'sht--qc'
  );
}

function rLevels(){const w=document.getElementById('levels-wrap');if(!w)return;const unlockedLevel=getUnlockedLevel(S.totalDone||0);let html='';Object.entries(LEVEL_META).forEach(([lvl,lm])=>{const lvlNum=parseInt(lvl,10),isUnlocked=lvlNum<=unlockedLevel,neededFor=LEVEL_UNLOCK[lvlNum],quests=QL.filter(q=>q.level===lvlNum),doneInLevel=S.completions.filter(c=>QL.find(q=>q.id===c.qid&&q.level===lvlNum)).length;html+=`<div style="background:var(--surface);border-radius:22px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,0.05);opacity:${isUnlocked?1:0.55}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${isUnlocked?'14px':'8px'}"><div style="display:flex;align-items:center;gap:10px"><div style="width:40px;height:40px;border-radius:20px;background:${lm.color}18;display:flex;align-items:center;justify-content:center;font-size:20px">${isUnlocked?lm.emoji:'🔒'}</div><div><div style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;color:var(--t)">Level ${lvlNum} · ${lm.name}</div><div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:0.06em;margin-top:2px">${quests.length} Quests · ${doneInLevel} erledigt</div></div></div>${!isUnlocked?`<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);text-align:right;letter-spacing:0.06em">Ab ${neededFor} Quests</div>`:''}</div>${isUnlocked?`<div style="font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t2);margin-bottom:14px">${lm.desc}</div><div style="display:flex;flex-direction:column;gap:8px">${quests.map(q=>{const isDone=S.completions.some(c=>c.qid===q.id),inQueue=S.weekQueue.includes(q.id),isFun=q.style==='fun';return`<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:${isDone?'rgba(5,150,105,0.05)':'var(--surface2)'};cursor:pointer" onclick="showQuestDetail('${q.id}')"><div style="width:28px;height:28px;border-radius:14px;background:${isDone?'var(--g)':'var(--border)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px">${isDone?'✓':''}</div><div style="flex:1;min-width:0"><div style="font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--t);${isDone?'text-decoration:line-through;opacity:0.5':''}">${escHtml(q.title)}${isFun?'<span style="font-size:10px;margin-left:4px">🎭</span>':''}</div></div>${inQueue?`<span style="font-family:'DM Mono',monospace;font-size:8px;color:var(--am);font-weight:700">HEUTE</span>`:isDone?'':`<button onclick="event.stopPropagation();addToWeekQueue('${q.id}')" style="background:var(--t);border:none;border-radius:8px;padding:5px 10px;font-family:'DM Mono',monospace;font-size:8px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap">+ HEUTE</button>`}</div>`}).join('')}</div>`:`<div style="background:var(--surface2);border-radius:12px;padding:12px;text-align:center"><div style="font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t3);line-height:1.5">🔒 Noch ${neededFor-(S.totalDone||0)} Quests bis Level ${lvlNum}</div></div>`}</div>`;});w.innerHTML=html;}
function addToWeekQueue(qid){
  S.weekQueue=S.weekQueue||[];
  if(S.weekQueue.length>=3){
    showSheet(`
      <div class="shdl"></div>
      <div class="sht-t">Schon 3 Quests aktiv</div>
      <div class="sht-s">Entferne zuerst eine Quest
        auf der Startseite.</div>
      <button class="btn-sv" onclick="closeSheet();go('home')">
        Zur Startseite
      </button>
    `);
    return;
  }
  if(S.weekQueue.includes(qid))return;
  S.weekQueue.push(qid);
  S.weekDone=S.weekDone||{};
  S.weekDone[qid]=[0,0,0,0,0,0,0];
  sv();
  rLevels();
  rHome();
}

function rStats(){const w=document.getElementById('stats-wrap');if(!w)return;const total=S.totalDone||0,unlockedLevel=getUnlockedLevel(total),streak=S.streak||0,todayC=todayDoneIds().length,reflections=(S.completions||[]).filter(c=>c.reflection&&c.reflection.trim()).slice(-5).reverse();const outcomes={done:0,nein:0,skip:0};(S.completions||[]).forEach(c=>{if(outcomes[c.outcome]!==undefined)outcomes[c.outcome]++;});const nextLevel=unlockedLevel<5?unlockedLevel+1:null,nextUnlock=nextLevel!==null?LEVEL_UNLOCK[nextLevel]:null,progressToNext=nextUnlock?Math.min(100,Math.round(total/nextUnlock*100)):100;w.innerHTML=`<div class="sblock" style="margin-bottom:12px"><div class="sbt">📊 ÜBERSICHT</div><div class="sgrid"><div class="scell"><div class="sv">${total}</div><div class="sl">GESAMT</div></div><div class="scell"><div class="sv" style="color:var(--am)">${streak}🔥</div><div class="sl">STREAK</div></div><div class="scell"><div class="sv">${todayC}</div><div class="sl">HEUTE</div></div></div></div><div class="sblock" style="margin-bottom:12px"><div class="sbt">⭐ LEVEL</div><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="font-size:32px">${LEVEL_META[unlockedLevel].emoji}</div><div><div style="font-family:'DM Sans',sans-serif;font-size:16px;font-weight:800;color:var(--t)">Level ${unlockedLevel} · ${LEVEL_META[unlockedLevel].name}</div><div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);margin-top:3px">${total} von ${nextUnlock||total} Quests</div></div></div>${nextLevel!==null?`<div style="height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:6px"><div style="width:${progressToNext}%;height:100%;background:${LEVEL_META[unlockedLevel].color};border-radius:99px;transition:width .5s ease"></div></div><div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);text-align:right">Noch ${nextUnlock-total} bis Level ${nextLevel}</div>`:`<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--g);text-align:center">🏆 Höchstes Level erreicht</div>`}</div>${total>0?`<div class="sblock" style="margin-bottom:12px"><div class="sbt">🎯 ERGEBNISSE</div><div class="brow"><span class="blabel">✓ Gemacht</span><div class="btrack"><div class="bfill" style="width:${Math.round(outcomes.done/Math.max(total,1)*100)}%;background:var(--g)"></div></div><span class="bval">${outcomes.done}</span></div><div class="brow"><span class="blabel">Nein bekommen</span><div class="btrack"><div class="bfill" style="width:${Math.round(outcomes.nein/Math.max(total,1)*100)}%;background:#DC2626"></div></div><span class="bval">${outcomes.nein}</span></div><div class="brow"><span class="blabel">Kein Moment</span><div class="btrack"><div class="bfill" style="width:${Math.round(outcomes.skip/Math.max(total,1)*100)}%;background:var(--t3)"></div></div><span class="bval">${outcomes.skip}</span></div>${outcomes.nein>0?`<div class="insight"><p>Du hast ${outcomes.nein} mal ein Nein bekommen. Das ist der Kern von Rejection Therapy. Gut gemacht.</p></div>`:''}</div>`:''}${reflections.length?`<div class="sblock" style="margin-bottom:12px"><div class="sbt">📖 LETZTE REFLEXIONEN</div>${reflections.map(c=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);margin-bottom:4px">${c.title||''} · ${new Date(c.ts).toLocaleDateString('de')}</div><div style="font-family:'DM Sans',sans-serif;font-size:13px;color:var(--t);line-height:1.5">${escHtml(c.reflection)}</div></div>`).join('')}</div>`:''}`;}

function showCel(q){const c=document.getElementById('cel');if(!c)return;c.style.display='block';c.style.pointerEvents='all';const newLevel=getUnlockedLevel(S.totalDone),levelUp=newLevel>=(q.level+1)&&S.totalDone===LEVEL_UNLOCK[newLevel];c.innerHTML=`<div class="cel-ov"><div class="cel-box"><div class="cel-ck">${q.style==='fun'?'🎭':'✅'}</div><div class="cel-t">${levelUp?'Level '+newLevel+' freigeschaltet!':'Quest erledigt!'}</div><div class="cel-s">${levelUp?LEVEL_META[newLevel].emoji+' '+LEVEL_META[newLevel].name+' ist jetzt verfügbar.':'Jede Handlung verändert das Muster. Rep #'+(S.totalDone||1)+'.'}</div><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);margin-bottom:16px">${q.title}</div><button class="btn-cel" onclick="closeCel()">Weiter →</button></div></div>`;setTimeout(closeCel,6000);}
function closeCel(){const c=document.getElementById('cel');if(c){c.style.display='none';c.style.pointerEvents='none';}}

function showSheet(html,shtExtra){var cls='sht'+(shtExtra?' '+shtExtra:'');document.getElementById('modal').innerHTML=`<div class="olay" id="ol"><div class="obg" onclick="closeSheet()"></div><div class="${cls}">${html}</div></div>`;}
function closeSheet(){const ol=document.getElementById('ol');if(ol)ol.remove();}

ld();
if(S.lastLogin!==td){if(S.lastLogin===yd)S.streak=(S.streak||0)+1;else if(!S.lastLogin)S.streak=1;S.lastLogin=td;sv();}
go('home');
</script>
<div id="profile-funnel" aria-hidden="true"></div>
</body>
</html>
